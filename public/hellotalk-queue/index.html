 or a daily rhythm I had become attached to?\n\nI think that is one of the most confusing things about online romance.\n\nDo you think daily conversation signals seriousness, or do you look for other actions?"},{"key":"A","label":"A · Faithful","zh":"每天聊天，很容易让人觉得自己已经在谈恋爱了。\n\n早上醒来先说早安，晚上睡觉前说晚安。\n\n吃饭拍给对方看，遇到小事也第一时间分享。几个星期以后，对方已经进入了你每天的生活 📱\n\n这种亲密感当然是真的。\n\n但我觉得，聊天的频率和关系的确定程度，不一定是同一件事。\n\n一个人可以每天陪你聊天，却从来没有明确说过：\n\n🔹你们是不是排他的\n🔹他怎么看待这段关系\n🔹什么时候准备见面\n🔹如果关系遇到问题，他愿不愿意处理\n\n每天的信息创造了一种“我们已经在一起”的感觉，但如果没有这些更具体的行动，两个人可能只是建立了一种很亲密的习惯。\n\n习惯被突然打断时，当然也会让人很难过。\n\n所以我不是说每天聊天没有意义，而是不要只用消息数量来判断一个人有多认真。\n\n你觉得每天聊天多久以后，会自然地变成一段关系？","en":"Talking every day can easily make you feel as though you are already in a relationship.\n\nYou say good morning after waking up and good night before sleeping.\n\nYou send photos of your meals and share every small event as it happens. After a few weeks, that person has become part of your daily life 📱\n\nThat sense of intimacy is absolutely real.\n\nBut I don’t think the frequency of chatting and the certainty of the relationship are necessarily the same thing.\n\nSomeone can talk to you every day without ever clearly saying:\n\n🔹Whether you are exclusive\n🔹How they define the connection\n🔹When they plan to meet\n🔹Whether they will work through problems when they appear\n\nDaily messages create the feeling that “we’re already together,” but without more concrete actions, the two of you may simply have developed a very intimate habit.\n\nWhen that habit suddenly stops, it can naturally hurt.\n\nI’m not saying daily communication has no meaning. I’m saying that message volume alone shouldn’t be used to measure how serious someone is.\n\nHow long can two people chat every day before it naturally becomes a relationship?"}],"comment":{"zh":"有些人本来就很会聊天，也很享受陪伴感，但不一定准备好承担一段关系。反过来也有人不爱发很多消息，却会认真安排见面和未来。所以还是要看完整的行为，不只是聊天记录。","en":"Some people are naturally good at chatting and enjoy companionship without necessarily being ready for a relationship. Others send fewer messages but seriously plan meetings and a future. It is better to look at the whole pattern of behavior, not only the chat history."},"poll":{"zh":"什么最能说明一个人是认真的？\n\nA）每天主动联系\nB）明确确认关系\nC）安排见面和未来\nD）长期稳定的行动","en":"What shows most clearly that someone is serious?\nA) Reaching out every day\nB) Clearly making the relationship official\nC) Arranging to meet and planning ahead\nD) Steady behavior over a long stretch"},"picture":"Ready to post. Nine photos in photos/013-video-call/\nBest photo match in the whole queue.\n\nAll nine are your video calls with Lina, ordered so the call timer counts up.\nA viewer reads that without being told. The post asks whether talking every day\ncounts as a relationship, and the pictures are an hour of one call.\n\n  1  01_both-of-us-on-the-call    47:01, both faces\n  2  02_leaning-in                01:05:54\n  3  03_still-talking             01:06:06\n  4  04_pulling-a-face            01:06:16\n  5  05_squishing-her-cheeks      01:06:19\n  6  06_shouting-at-the-camera    01:06:21\n  7  07_lina-smiling              01:06:28\n  8  08_laughing                  01:06:31\n  9  09_blowing-a-kiss            01:06:44\n\nKeep the order. Talking, then silly, then laughing, then a kiss.\n\nTags: Longdistancerelationship / International dating / travel","rating":"Score: 8.5/10, ready to post","direction":"Do the women messaging you usually cite daily good-morning/good-night texts as the main evidence that the relationship was serious?"},{"id":"014","file":"014-long-distance-needs-meeting-plan.md","title":"A Long-Distance Relationship Needs a Plan to Stop Being Long-Distance","versions":[{"key":"C","label":"C · Voice pass","zh":"\"我以后一定会去看你的。\"\n\n听着挺好。但\"以后\"不是一个日期 😅\n\n跨国肯定比普通异地更难，这个我知道。几千公里，机票，签证，假期，还有先去谁的国家。有时候真的不是不想见，是真的还做不到。\n\n但我觉得，一段认真的异地最后需要一个目标，就是不再异地。\n\n不用马上。\n\n第一个计划失败也没关系，今年做不到也没关系。\n\n但两个人都要愿意把\"以后\"慢慢变成具体的东西。哪个月，哪个城市。要存多少钱，什么时候再拿出来看一次。\n\n天可以一直聊下去，承诺也可以一直说下去。\n\n只有计划会逼两个人认真看一眼：我们是不是真的愿意为了见面花时间、花钱、去做事。\n\n如果在一起好几个月了，这个话题还是聊不了，我会有点怀疑。\n\n反正我是觉得，一直待在手机里是不行的 📱✈️\n\n多久没有见面的日期，你会开始担心？","en":"\"I'll definitely come and see you one day.\"\n\nSounds nice. One day isn't a date though 😅\n\nCross-border is harder than normal long distance, I know that. Thousands of kilometres, flights, visas, holiday days, whose country first. Sometimes people genuinely want to meet and genuinely can't yet.\n\nBut I think a serious long distance thing needs one goal in the end, which is not being long distance.\n\nDoesn't have to be soon.\n\nThe first plan doesn't have to work, and it might not even be this year.\n\nBut both of you have to be willing to slowly turn one day into something real. Which month, which city. How much needs saving, and when you'll look at it again.\n\nYou can keep talking forever, and keep promising forever.\n\nA plan is the thing that makes you both look at it properly. Are we actually willing to put time and money and effort into meeting.\n\nIf two people have been together for months and still can't have that conversation, I'd have doubts.\n\nI just don't think it can stay on the phone forever. That's my opinion anyway 📱✈️\n\nHow long would you go with no date to meet?"},{"key":"B","label":"B · Creative","zh":"“以后我一定会去见你。”\n\n这句话很浪漫，但“以后”不是一个日期 😅\n\n跨国恋爱当然比普通异地恋更难。\n\n隔着几千公里，还要考虑机票、签证、假期和谁先去谁的国家。有时候不是不想见，是真的暂时做不到。\n\n但我觉得，一段认真的异地关系最终必须有一个目标：结束异地。\n\n不一定马上。\n\n不一定计划一次就成功。\n\n甚至不一定今年就能做到。\n\n但双方应该愿意把“有一天”慢慢变成更具体的东西：哪个月份、哪座城市、需要准备多少钱、下一次什么时候再确认计划。\n\n因为聊天可以一直继续，承诺也可以一直重复。\n\n只有计划会逼着两个人面对现实：我们真的愿意为了见面付出时间、金钱和行动吗？\n\n如果一段关系聊了几个月，却连这个问题都不能认真讨论，那我会对它的未来比较怀疑。\n\n异地恋可以从手机开始，但不能永远只活在手机里 📱✈️\n\n你能接受一段没有见面日期的异地关系持续多久？","en":"“I’ll definitely come and see you one day.”\n\nThat sounds romantic, but “one day” is not a date 😅\n\nInternational relationships are naturally more difficult than ordinary long-distance ones.\n\nYou may be thousands of kilometers apart while dealing with flights, visas, vacation time, and deciding who visits whose country first. Sometimes it isn’t that people don’t want to meet. They genuinely cannot do it yet.\n\nBut I believe a serious long-distance relationship eventually needs one goal: ending the distance.\n\nIt doesn’t have to happen immediately.\n\nThe first plan doesn’t have to succeed.\n\nIt may not even be possible this year.\n\nBut both people should be willing to gradually turn “one day” into something more concrete: which month, which city, how much money needs to be saved, and when they will revisit the plan.\n\nConversation can continue forever, and promises can be repeated forever.\n\nOnly a plan forces both people to face reality: are we genuinely willing to invest time, money, and action into meeting?\n\nIf two people have been in a relationship for months but cannot seriously discuss this question, I would doubt its future.\n\nA long-distance relationship can begin on a phone, but it cannot live there forever 📱✈️\n\nHow long would you accept a long-distance relationship without a meeting date?"},{"key":"A","label":"A · Faithful","zh":"我觉得异地恋最重要的问题不是“你有多想我”，而是：\n\n“我们准备什么时候见面？” ✈️\n\n有人和欧美男生聊了几个月，甚至已经把对方当成男朋友，但两个人一直没有任何具体的见面计划。\n\n当然，跨国见面并不容易。\n\n机票、签证、工作、距离，每一个都可能成为现实问题。\n\n不是每个人都能马上订一张票飞到另一个国家。\n\n但“现在还不能见”跟“从来不认真讨论怎么见”是两回事。\n\n一段长期停留在线上的关系，至少需要一个方向：\n\n🔹大概什么时候见\n🔹谁去哪个国家\n🔹要存多少钱或准备什么材料\n🔹如果计划推迟，下一步是什么\n\n计划可以改变，日期也可以调整。\n\n但如果几个月过去，对方每次都回避这个话题，只想继续说“以后一定会见”，那这段关系可能一直活在“以后”里。\n\n你觉得异地聊多久以后，应该开始认真计划见面？","en":"I think the most important question in a long-distance relationship isn’t “How much do you miss me?” It is:\n\n“When are we planning to meet?” ✈️\n\nPeople talk to someone abroad for months, call them their boyfriend, and still have no concrete plan to meet.\n\nOf course, meeting internationally is not easy.\n\nFlights, visas, work, and distance can all create genuine obstacles.\n\nNot everyone can immediately book a ticket and fly to another country.\n\nBut “we can’t meet yet” and “we never seriously discuss how to meet” are two different things.\n\nA relationship that remains online for a long time needs at least a direction:\n\n🔹Approximately when you will meet\n🔹Who will travel to which country\n🔹How much money or which documents need to be prepared\n🔹What happens next if the plan is delayed\n\nPlans can change, and dates can move.\n\nBut if several months pass and the other person avoids the subject every time, preferring to say only, “We’ll definitely meet one day,” the relationship may remain trapped inside “one day.”\n\nHow long do you think long-distance couples should talk before seriously planning to meet?"}],"comment":{"zh":"我说的“计划”不一定非要已经买好机票。哪怕只是双方认真研究签证、预算和大概时间，也说明这件事正在从想象走向现实。最怕的是每次问到就换话题。","en":"By “plan,” I don’t necessarily mean that the tickets must already be booked. Even seriously researching visas, budgets, and a rough timeline shows that the idea is moving from imagination toward reality. The biggest warning sign is changing the subject every time it comes up."},"poll":{"zh":"异地关系多久没见面计划，你会开始担心？\n\nA）一个月\nB）三个月\nC）半年\nD）没有固定标准，看行动","en":"How long with no plan to meet before you'd start to worry?\nA) One month\nB) Three months\nC) Six months\nD) No fixed rule, I watch what they actually do"},"picture":"Ready to post. Nine photos in photos/014-long-distance/\n\nThe airport photos this note used to ask for do not exist. The library has almost\nno camera photos from the last week of August, so there is no shot of Lina at the\ngate. Checked, not guessed.\n\nWhat works better anyway: the set is the Italy trip you two actually took, and the\nninth photo is a video call. Eight photos of a plan that happened, then the screen\nyou are back to. That is the argument without a caption.\n\n  1  01_old-town-gate             old town gate, bikes\n  2  02_in-the-valley             the two of you small in a wide valley\n  3  03_venice-square             Venice square\n  4  04_venice-canal              Venice canal\n  5  05_dolomites-road            Dolomites road out the windscreen\n  6  06_lago-di-braies            Lago di Braies, the two of you\n  7  07_both-of-us-at-the-lake    standing at the lake\n  8  08_hugging-at-the-lake       hugging at the lake\n  9  09_and-now-a-video-call      and now, a video call\n\nOne thing only you can add. If the next flight is booked, screenshot it and make it\nphoto 10. That single image is the whole post. If it is not booked, say so in the\ntext. More honest, and better for comments, than implying the plan exists.\n\nWorth moving to the front of the queue.\n\nTags: Longdistancerelationship / travel / International dating","rating":"Score: 9/10, ready to post","direction":"Do you and Lina have a personal story about the first concrete trip or meeting plan you made? That could provide an even stronger ending to the series."},{"id":"015","file":"015-too-many-options.md","title":"Too Many Options, or Not Enough?","versions":[{"key":"C","label":"C · Voice pass","zh":"选择太多和选择太少，哪个更难受？\n\n我最近在听一个播客，讲的是怎么找自己的人生方向，第一部分有个说法我一直记着。很多对自己人生的焦虑，其实是因为选择太多 🤔\n\n不是被困住的那种。是能做的事情太多，然后挑不出来。\n\n我觉得在西方一般都是这种情况。选择太多。住在哪里。做什么工作。还有最后跟谁在一起，这个又是另一回事了。你把所有的选项都留着，然后又为这件事难受。\n\n但反过来的情况也有。就是因为根本没得选而觉得憋得慌。\n\n我不知道的是，在这边到底是哪一种 👀\n\n从外面看，好像这里更早就得定下来，而且能选的东西也更少。但我真的不知道从里面看是什么感觉。\n\n所以我想问问你们。选择太多，还是选择太少？💬","en":"Is it worse to have too many options, or not enough?\n\nI've been listening to a podcast about finding your life path, and something in the first part stuck with me. A lot of anxiety about your own life comes from having too many options 🤔\n\nNot from being stuck. From having too many things you could do, and not being able to pick.\n\nI think in the West that's usually what it is. Too much choice. Where to live. What job. And then who you end up with, which is its own thing. You keep all the options open and then you feel bad about it.\n\nBut the opposite happens too. Being frustrated because there's nothing to choose from at all.\n\nWhat I don't know is which one it is here 👀\n\nFrom the outside it looks like there's more pressure to settle on something early, and fewer things to settle on. But I have no idea how that actually feels.\n\nSo I'm asking. Too many options, or not enough? 💬"}],"comment":{"zh":"补充一下，我自己二十几岁的时候就是选择太多那种，什么都不敢定下来。后来反而是先定了几件事，才没那么焦虑了。","en":"To add to that, in my twenties I was the too-many-options type, afraid to settle on anything. It ended up being the opposite that helped: settling a few things first is what made me less anxious."},"poll":{"zh":"你对自己人生的焦虑，更多来自哪一种？\n\nA）选择太多，挑不出来\nB）选择太少，没得选\nC）两个都有\nD）我没什么焦虑 😂","en":"Which one causes you more anxiety about your own life?\nA) Too many options, can't pick\nB) Too few options, nothing to pick from\nC) Both\nD) I'm not anxious about it 😂"},"picture":"Half built. Five photos in photos/016-four-places/ that this post can share.\n\nBest set is four photos, one from each city you cycle through: Chaozhou, Kunming,\nthe Netherlands, the US. The post asks whether too many options is the problem, and\nfour cities in a row is the too many options.\n\n  ready   three of the Chaozhou flat mid renovation, bare concrete and cement bags\n  ready   two of the Netherlands, a flat field and a church\n  missing Kunming\n  missing the US\n\nCorrection from the last pass: Pictures/Content/ is empty. The Chaozhou and Kunming\nsubfolders exist but hold no files, so that earlier pointer was wrong. Nothing is\nlost, the photos are in the main iCloud library by date. Tell me roughly when you\nwere in Kunming and the US and I will pull them.\n\nPhoto 5 if you want one more: a departure board, or your laptop open somewhere you\ndo not live.\n\nTags: travel / lifestyle / culture","rating":"Score: 8.5/10, ready to post","direction":"Do you have a concrete moment for this one? The post is currently an idea rather than a\nstory, which is the weaker of the two shapes for you. Something like the year you could not\ndecide where to live, or a specific conversation with someone paralysed by choice, would\nmake it land harder than the podcast reference does."},{"id":"016","file":"016-nomad-versus-staying-put.md","title":"Does Staying in One Place Make You Happier?","versions":[{"key":"C","label":"C · Voice pass","zh":"一直待在一个地方，是不是真的会更开心？\n\n我最近在听的那个播客，主播叫 Mark Manson。他二十多岁到三十出头一直是数字游民，后来停下来，定在一个地方生活了。他说这个转变对他来说效果特别好，而且他身边的朋友也差不多 🤔\n\n我不太确定我同意。不过我可能也不是最适合回答这个的人，因为我和 Lina 过的是慢一点的那种。\n\n我们不是每几个星期就换一个城市。一般在一个城市待两到四个月，然后再换。潮州、昆明、荷兰、美国，然后再转回来。\n\n所以我们其实是有固定的朋友，也有固定可以回去的地方的。也许真正的区别在这里，而不是你到底搬不搬 👀\n\n我现在还不觉得自己缺了什么。不过我也才这样过了两年左右，他比我久多了。\n\n你们搬过很多次吗？定下来之后是变好了还是变差了？💬","en":"Does staying in one place actually make you happier?\n\nThe podcast I've been listening to is by Mark Manson. He lived as a digital nomad through his twenties and early thirties, then stopped and settled in one place. He says that switch worked really well for him, and he's seen the same in his friends 🤔\n\nI'm not sure I agree. Although I might not be the right person to ask, because Lina and I do a slower version of it.\n\nWe don't change city every few weeks. We stay two to four months, then move. Chaozhou, Kunming, the Netherlands, the US, and then back around again.\n\nSo we do have the same friends and the same places to come back to. Maybe that's the real difference, and not whether you move at all 👀\n\nI don't feel like I'm missing anything yet. Although I've only been doing this about two years and he did it a lot longer than that.\n\nHave you moved around a lot? Did settling down make it better or worse? 💬"}],"comment":{"zh":"我们给这种生活起了个名字叫 slowmad，就是慢一点的数字游民。之前也发过一条讲这个的。区别就是有没有能回去的地方。","en":"We call this way of living \"slowmad\", a slower version of digital nomad. I posted about it before. The difference is whether you have somewhere to come back to."},"poll":{"zh":"你更想要哪一种生活？\n\nA）一直待在一个城市\nB）几年换一个地方\nC）像 slowmad 那样，两三个月换一次\nD）完全不固定，一直在动","en":"Which life would you rather have?\nA) Stay in one city\nB) Move every few years\nC) Slowmad, a new place every two or three months\nD) Nothing fixed at all, always moving"},"picture":"Half built. Five photos in photos/016-four-places/\n\nThe four places in a row, which is what the text already names. Chaozhou, Kunming,\nthe Netherlands, the US. One clear photo each, in that order, so the reader sees the\nloop rather than reading about it.\n\n  1  01_chaozhou-flat-outside     the building\n  2  02_chaozhou-bare-concrete    bare concrete, unfinished room\n  3  03_chaozhou-cement-bags      cement bags stacked in the flat\n  4  04_netherlands-flat-field    flat green field, big sky\n  5  05_netherlands-church        brick church\n     missing                      Kunming\n     missing                      the US\n\nPhotos 2 and 3 are the ones that make it honest. An unfinished flat shows the cost\nof the lifestyle rather than the highlight reel, which is what makes the question\nreal rather than smug.\n\nCorrection from the last pass: Pictures/Content/ is empty. Those named subfolders\nhold no files, so that pointer was wrong. Tell me roughly when you were in Kunming\nand the US and I will pull those two.\n\nTags: travel / lifestyle / digitalnomad","rating":"Score: 9/10, ready to post","direction":"Worth naming the four cities properly, or keep it loose? Naming them invites \"come to my\ncity\" comments, which is good for the meetups but pulls the thread away from the question."},{"id":"017","file":"017-explore-then-commit.md","title":"My Favourite Book Contradicts Itself","versions":[{"key":"C","label":"C · Voice pass","zh":"我最喜欢的一本书里，有两章的内容是完全矛盾的。\n\n这本书叫《How to Live》，作者是 Derek Sivers。其中一章叫 \"Fill Your Senses\"，另一章叫 \"Commit\"，讲的完全是相反的事 📖\n\n\"Fill Your Senses\" 说的是，同一件事不要做两次。同一个想法不要想两次，同一张床不要睡两次，同一个人不要谈两次。所有爱好都试一遍，没吃过的东西都吃一遍。世界上东西这么多，为什么要重复。\n\n\"Commit\" 说的正好相反。选一个，然后就留在那里。朋友一辈子就这几个。要是在跟一个人谈恋爱，那不如就结婚。要是住在一个城市，那不如就住一辈子。\n\n这两个我听着都觉得挺有道理的，有点烦 🤔\n\n我自己想了想，它们其实不是相反的。我觉得是有顺序的。二十几岁，可能到三十出头，先 \"Fill Your Senses\"。然后再 commit。\n\n数学里有个类似的问题，就是你应该看多久才做决定。结论大概是，你得看够多的选项，才知道自己真正喜欢什么，然后就该停下来了。\n\n我觉得谈恋爱也是这样，别的事情也差不多。\n\n你觉得自己在定下来之前，看得够多吗？还是反过来，看得太多了？💬","en":"My favourite book has two chapters that completely contradict each other.\n\nIt's called How to Live, by Derek Sivers. One chapter is \"Fill Your Senses\" and one is \"Commit\", and they argue the opposite thing 📖\n\nFill Your Senses says never do the same thing twice. Don't think the same thought twice, don't sleep in the same bed twice, don't date the same person twice. Try every hobby, eat things you've never eaten. There's so much out there, so why repeat anything.\n\nCommit says the opposite. Pick one and stay. The same friends for life. If you're dating someone, you might as well marry them. If you live in a city, you might as well live there forever.\n\nBoth of those sound right to me, which is annoying 🤔\n\nThinking about it, they're not really opposites. I think it's an order. Fill Your Senses in your twenties, maybe into your early thirties. Then commit.\n\nThere's a maths problem about this, about how long you should keep looking before you decide. Roughly, you have to see enough options to know what you actually like, and then you should stop looking.\n\nI think dating works the same way, and most other things too.\n\nDo you think you looked at enough before you settled down? Or the other way round, too much? 💬"}],"comment":{"zh":"顺便说一下，这本书里每一章都在反驳上一章，整本书没有给你一个答案。这也是我喜欢它的原因。","en":"By the way, every chapter in that book argues against the one before it, and the book never gives you an answer. That's part of why I like it."},"poll":{"zh":"关于\"先多看看，再定下来\"，你是哪一种？\n\nA）看得够多了，然后定下来\nB）定得太早，没怎么看过\nC）看太多了，反而定不下来\nD）还在看 😂","en":"Where are you on looking around before settling down?\nA) Looked at enough, then settled\nB) Settled too early, barely looked\nC) Looked at too much, now I can't settle\nD) Still looking 😂"},"picture":"Needs you. Nothing usable exists in the library, I searched. There is no photo\nof the book anywhere.\n\nTake these two, it takes a minute:\n\n  1  your own copy of How to Live by Derek Sivers. Paper if you have it, on your\n     phone or Kindle if not. Screen glare is fine, a real object beats a stock image\n  2  the two contradicting chapter titles, Fill Your Senses and Commit, in one shot\n     or one each\n\nThen 3 and 4 from what you already have. One photo from the exploring years, one\nfrom now with Lina. The post is about the order of those two things, so showing both\ncloses it. photos/011-then-and-now/ already has both ends of that range.\n\nTags: books / lifestyle / culture","rating":"Score: 9/10, ready to post","direction":"Two things would strengthen this. First, what did your own Fill Your Senses years actually\nlook like, concretely? The travelling, the apps, the hobbies you dropped. Second, do you\nthink you have committed yet, or are you still in the exploring half? Saying so either way\nis the sort of thing that pulls long comments."},{"id":"018","file":"018-introduction-post.md","title":"Introduction Post: Who I Am and Why We Live in Four Places","versions":[{"key":"C","label":"C · Voice pass","zh":"好久没在这儿好好做个自我介绍了，重新来一次。\n\n也想重新开始规律地发动态。之前发过一阵，然后断了两个月。这次希望能坚持久一点 😅\n\n我叫 Michael，荷兰裔美国人，31 岁。\n\n我当初下这个 App 是为了学日语，后来改成了学中文，然后在这儿认识了 Lina，现在她是我老婆。\n\n所以这个 App 对我来说算是值了。\n\n我平时发的基本就是我们的生活，还有一些我觉得有意思的话题。我和 Lina 到处跑的时间比较多，也确实比一般人更爱琢磨我们自己这段关系，所以内容慢慢就变成跨国恋爱居多。后来有人私信问我这方面的事，我就干脆写成动态来回答。\n\n如果我用到聊天里的内容，我一定会做匿名处理。不写名字，也不留任何能认出是谁的信息。\n\nLina 是英语老师。之前在学校教了几年，现在做线上教学，同时在学心理学，以后想做心理咨询。\n\n我们俩还有一点，就是没有一个固定住的地方。\n\n西方有个词叫 snowbird，字面意思是雪鸟。夏天住在北边凉快的地方，到了冬天就搬去南边。美国不少人这样，纽约或者波士顿有个家，佛罗里达再有一个。我觉得跟中文说的候鸟式生活挺像的。\n\n我们在做自己的版本，只不过是四个地方，不是两个。广东、昆明、荷兰，还有美国的佐治亚州 🌍\n\n现在还没孩子。过几年打算要，到时候也想尽量保持这种生活方式。\n\n我知道很多人一听就会觉得，这样对小孩不太好 🤔\n\n反正，有什么想问的都可以问我。","en":"It's been a while since I properly introduced myself on here, so, doing it again.\n\nI'm also trying to post regularly again. I did that for a while before and then dropped off for two months. Hoping I keep it up longer this time 😅\n\nI'm Michael. Dutch-American, 31.\n\nI downloaded this app to learn Japanese. Then I switched it to Chinese. Then I met Lina on here, and now she's my wife.\n\nSo the app worked out for me.\n\nI mostly post about our life and about topics I think are interesting. Lina and I travel a lot, and we do think about our own relationship more than most people, so it slowly turned into mostly intercultural dating. People started messaging me questions about it, so I started answering them in posts instead.\n\nIf I ever use something from one of those conversations, I anonymize it. No names, nothing left that could identify anyone.\n\nLina is an English teacher. She taught at a school for a few years, now she teaches online, and she's studying psychology to become a therapist.\n\nWe also don't really have one place we live.\n\nThere's a word in the West, snowbird. Literally snow bird. You live up north where the summer is nice, then move south for the winter. Plenty of Americans do it, a house in New York or Boston and a second one in Florida. I think it's close to what Chinese people call 候鸟式生活.\n\nWe're doing our own version, except with four places instead of two. Guangdong, Kunming, the Netherlands, and Georgia in the US 🌍\n\nNo kids yet. We want them in a few years, and I'd like to keep some version of this going when we do.\n\nI know a lot of people hear that and think it's not good for a kid 🤔\n\nAnyway. Ask me anything."},{"key":"B","label":"B · Creative","zh":"我们打算让孩子在四个国家轮着长大。\n\n我知道这听起来像什么 🤔\n\n先自我介绍一下，因为我好像一直没在这儿正经介绍过。我叫 Michael，荷兰裔美国人，31 岁。当初下这个 App 是为了学日语，后来改成中文，然后在这儿认识了我老婆 Lina。所以算是值了。\n\n我们现在过的这种生活，西方有个说法叫 snowbird，雪鸟。夏天住北边凉快的地方，冬天搬去南边。很多美国人波士顿有个家，佛罗里达再有一个。跟中文的候鸟式生活挺像。\n\n我们的版本是四个地方，不是两个。广东、昆明、荷兰，还有美国的佐治亚州 🌍\n\n现在还没孩子，过几年打算要。而且我不太想因为有了孩子就放弃这种生活。我觉得一个在四个地方长大的小孩，能得到很多别的小孩得不到的东西。\n\n我听到最多的反应是：太不稳定了，小孩需要一个固定的学校、一群固定的朋友、一个固定的家。\n\n说实话我也不确定谁对。我看了不少在家教育那边的东西，到现在还是来回摇摆 😅\n\n所以来说服我。如果是你的孩子，你会怎么选？","en":"We're planning to raise a kid across four countries.\n\nI know what that sounds like 🤔\n\nQuick introduction first, because I don't think I've ever properly done one on here. I'm Michael, Dutch-American, 31. I downloaded this app to learn Japanese, switched it to Chinese, and then met my wife Lina on here. So it worked out.\n\nThe life we're doing now, there's a western word for a version of it. Snowbird. You live up north where the summer is nice, then move south for the winter. A lot of Americans have a house in Boston and a second one in Florida. Pretty close to 候鸟式生活.\n\nOurs is four places instead of two. Guangdong, Kunming, the Netherlands, and Georgia in the US 🌍\n\nNo kids yet, we want them in a few years. And I don't really want to give this up once we have them. I think a kid who grows up across four places gets a lot that other kids don't.\n\nThe reaction I get most is that it's too unstable, that a kid needs one school, one set of friends, one home.\n\nHonestly I'm not sure who's right. I've read a lot from the homeschooling side and I still go back and forth 😅\n\nSo convince me. If it were your kid, what would you pick?"}],"comment":{"zh":"另外，如果你有什么想聊的话题，直接跟我说就行。聊出有意思的东西我可能会写成动态，当然会匿名。\n\nLina 也在这个 App 上。她现在做线上英语教学，也在学心理学，如果你对这些感兴趣，可以去她那边看看。","en":"Also, if there's a topic you want to talk about, just tell me. If the conversation turns into something interesting I might write a post about it, anonymized of course.\n\nLina is on this app too. She teaches English online now and is studying psychology, so if those are your thing you can go have a look at her profile."},"poll":{"zh":"你最想看我发哪一类的内容？\n\nA）跨国恋爱和感情话题\nB）中西文化差异\nC）旅行和这种到处跑的生活方式\nD）育儿和教育观","en":"Which of these do you most want me to post about?\nA) Cross-cultural dating and relationships\nB) China versus the West\nC) Travel and this move-around lifestyle\nD) Raising kids and education"},"picture":"Locked. Nine photos in photos/018-introduction/ , picked by you on 2026-09-03.\n\n  1  01_the-two-of-us                close selfie, the plain \"this is us\" opener\n  2  02_registration-day             registration day, red backdrop\n  3  03_tiananmen-in-winter          Tiananmen, winter coats\n  4  04_harbin-at-night              St Sophia in Harbin, lit up\n  5  05_helsinki                     walking past the Helsinki sign\n  6  06_dog-cafe                     the dog cafe, surrounded by them\n  7  07_travelling                   the two of you on the move, coats on\n  8  08_dinner-out                   dinner, purple light, food on the table\n  9  09_dressed-up-by-the-water      dressed up by the water\n\nThe first five are the milestones, the last four are ordinary days. That order is what\nmakes it an introduction rather than a highlight reel.\n\nEvery one of the nine has a person in it. The first attempt ended on a lake, an empty\nfield and an unfinished room, and you called it: photos with nobody in them say nothing\nabout who you are.\n\nTags: International dating / travel / lifestyle","rating":"Score: 8.5/10, ready to post","direction":"The kids line is doing all the work at the end of Version C, and Version B is the same post\nwith that line moved to the front. Do you want the introduction to be gentle and let the\nparenting debate be its own post next, or would you rather open on the four countries thing\nand get the argument started immediately?"},{"id":"019","file":"019-messaging-a-married-man.md","title":"Is It Strange to Have Opposite Gender Friends in China?","versions":[{"key":"D","label":"D · His opening, 2026-09-08","zh":"在中国，有对象以后还有异性朋友，是不是有点奇怪？👀\n\n我在这里发了不少感情方面的内容，所以经常收到中国女生的私信。而且很多时候，她们开头都会说一句\"你太太好漂亮\"，或者用别的方式提一下我太太，让我知道她们知道我结婚了。\n\n我感觉她们可能会觉得，直接找一个有伴侣的人聊天有点不好意思，不想让我误会。\n\n在西方，我觉得给异性发消息、跟异性做朋友都挺正常的，不管对方有没有对象。\n\n不过我也听说过，在中国有些情侣是完全不让对方跟异性联系的。\n\n碰到这种情况的时候，我会觉得这两个人其实不太信任对方，那他们只要一分开，就会一直担心对方会不会出轨什么的，这样谈恋爱应该挺累的 😅\n\n我和 Lina 有时候会分开很长一段时间，现在就在异地，两个月。如果我们之间没有这种信任，这两个月应该会非常难过。\n\n下面这几张里，有我和 Lina，也有我们各自的朋友 📷\n\n你们自己呢？会跟对象说一声，还是根本不用提？💬","en":"Is it strange to have friends of the opposite gender in China when you're in a relationship? 👀\n\nI post a lot of relationship stuff here, so I get a lot of messages from Chinese women. And a lot of the time they always start by saying \"your wife is so beautiful\", or they mention my wife some other way, so I know that they know I'm married.\n\nI get the feeling that they feel awkward reaching out to someone who already has a partner, and don't want me to get the wrong idea.\n\nIn the west I feel like it's seen as perfectly normal to reach out to or befriend someone of the opposite gender, regardless of whether they're in a relationship or not.\n\nThough I've heard of situations in China where both partners absolutely refuse to let their partner reach out to someone of the opposite gender.\n\nWhen that comes up I feel like those two don't really trust each other, which means anytime they're apart they're constantly worried that their partner will cheat on them or something, which makes the relationship quite painful 😅\n\nLina and I will occasionally be apart for long stretches of time. Right now we're doing 2 months long distance. If we didn't trust each other in this manner then this period of time would be incredibly difficult.\n\nIn the photos there's the two of us, and also some of the friends we each have 📷\n\nWhat about you? Do you tell your partner about it, or does it just not come up? 💬"},{"key":"C","label":"C · Voice pass","zh":"我发现很多中国女生给我发消息的时候，开头都会说一句\"你太太好漂亮\"，或者用别的方式提一下我太太，让我知道她们知道我结婚了 👀\n\n我感觉她们可能会觉得，直接找一个有伴侣的人聊天有点不好意思，不想让我误会。\n\n在西方，我觉得给异性发消息、跟异性做朋友都挺正常的，不管对方有没有对象。\n\n不过我也听说过，在中国有些情侣是完全不让对方跟异性联系的。\n\n碰到这种情况的时候，我会觉得这两个人其实不太信任对方，那他们只要一分开，就会一直担心对方会不会出轨什么的，这样谈恋爱应该挺累的 😅\n\n我和 Lina 有时候会分开很长一段时间，现在就在异地，两个月。如果我们之间没有这种信任，这两个月应该会非常难过。\n\n在你们那边，有对象以后还有异性朋友，算正常吗？💬","en":"I noticed that a lot of the time when Chinese women message me, they always start by saying 'your wife is so beautiful', or mentioning my wife somehow, to acknowledge that they know I'm married 👀\n\nI get the feeling that they feel awkward reaching out to someone directly who has a partner, and don't want me to get the wrong idea.\n\nIn the west I feel like it's seen as perfectly normal to reach out to or befriend someone of the opposite gender, regardless of whether they're in a relationship or not.\n\nThough I've heard of situations in China where both partners absolutely refuse to let their partner reach out to someone of the opposite gender.\n\nWhen this situation comes up, I feel like the couple doesn't trust each other, which means anytime that they're apart they're constantly worried that their partner will cheat on them or something, which makes the relationship quite painful 😅\n\nLina and I will occasionally be apart for long stretches of time. Right now we're doing 2 months long distance. If we didn't trust each other in this manner then this period of time would be incredibly difficult.\n\nIs it normal where you are, having friends of the opposite gender when you're with someone? 💬"},{"key":"B","label":"B · Creative","zh":"\"你太太好漂亮。\"\n\n这句话我经常收到，而且几乎都是第一句 👀\n\n一开始我没多想。后来发现太一致了。中国女生给我发消息，开头几乎都会用某种方式提一下我结婚了。\n\n我觉得这不是在夸人。更像是一个很小的礼貌动作：我知道你有太太，我不是那个意思，你别担心。\n\n说实话，这挺周到的，我也挺领情。\n\n但它同时也说明了一件事。会有这句开场白，是因为\"给已婚男生发消息\"在这边是需要解释一下的。\n\n在我们那边就不用。有伴侣之后还有异性朋友很正常，也没人会先去报备。\n\n我也听说过更严格的版本，有的情侣互相都不许跟异性联系。\n\n我和 Lina 现在异地两个月。如果我们那样过日子，我觉得撑不下来 😅\n\n所以我更好奇那句开场白本身。你会这样写吗？写的时候心里其实在想什么？💬","en":"\"Your wife is so beautiful.\"\n\nI get that a lot, and it's almost always the first line 👀\n\nAt first I didn't think about it. Then I noticed how consistent it is. Messages from Chinese women almost always start by acknowledging I'm married, one way or another.\n\nI don't think it's a compliment exactly. It feels more like a small polite move. Something like, I know you have a wife, I'm not here for that, don't worry.\n\nHonestly it is considerate, and I do appreciate it.\n\nBut it also tells me something. That opener only exists because messaging a married guy is a thing you'd have to explain here.\n\nWhere I'm from you don't need it. Having friends of the opposite gender once you're with someone is normal, and nobody clears it first.\n\nI've heard the stricter version here too, couples who won't let each other contact the opposite gender at all.\n\nLina and I are two months apart right now. If we ran things that way I don't think we'd make it 😅\n\nSo I'm more curious about the opener itself. Do you write something like that, and what's actually going through your head when you do? 💬"}],"comment":{"zh":"说明一下，我不是说中国的情侣就不信任对方。每个人的情况不一样，很多人也是两个人商量好的。我说的是那种完全不许联系的情况。\n\n另外，\"你太太好漂亮\"这句话我每次看到都挺开心的，Lina 也都会看到 😄","en":"To be clear, I'm not saying Chinese couples don't trust each other. Everyone's situation is different, and plenty of people have agreed on it together. I mean the version where contact isn't allowed at all.\n\nAlso, I'm always happy to see \"your wife is so beautiful\". Lina sees all of them 😄"},"poll":{"zh":"有伴侣以后，还能有异性朋友吗？\n\nA）可以，很正常\nB）可以，但要让对方知道\nC）最好少一点，容易出问题\nD）不行，我接受不了","en":"Once you're with someone, can you still have friends of the opposite gender?\nA) Yes, totally normal\nB) Yes, but the other person should know\nC) Better to keep it minimal, it causes problems\nD) No, I couldn't accept it"},"picture":"**Nine of nine. His own selection, recovered from a screenshot on 2026-09-08.**\n\n  1  01_video-call              a video call on screen\n  2  02_on-the-sand             two people lying on sand, shot from above\n  3  03_selfie-striped-tee      selfie, striped tee\n  4  04_couch-eggs-bowls        two bowls with fried eggs, on a couch\n  5  05_kitchen-table-rice-beer table, rice dish, beer glasses\n  6  06_party-pearl-necklace    indoors at a party, pearl necklace\n  7  07_river-bed-mountains     river bed, mountains behind\n  8  08_beach-sunset            beach at sunset\n  9  09_street-white-fur-hat    street, white fur hat, sunglasses\n\nIn `photos/019-opposite-gender-friends/` and in\n`iCloudDrive\\HelloTalk Photos\\019 Opposite gender friends\\`, same names, same order.\nEverything superseded is in that folder's `archive/`.\n\n**How the set was recovered, and why it was not just read off the screenshot.** His picks\nwere made on michaelcastelein.com and never saved, so the only record was a screenshot of\nthe nine thumbnails. Rather than eyeballing which photo each thumbnail was, the strip was\ncropped out of the screenshot and matched against all 263 pool thumbnails by normalised\npixel correlation, reproducing the page's own `object-fit: cover` crop first. Every slot\nmatched at 0.87 to 0.95, and the pairs were then checked side by side in\n`work/match/verify.png`. Two slots had a thin margin, 0.10 and 0.16, which is exactly why\nthe visual check happened rather than trusting the score.\n\n**Two of these were dropped by Claude an hour earlier and he wanted them.**\n`07_river-bed-mountains` and `08_beach-sunset` were cut on the reasoning that distant\nfigures in a landscape fail the \"photo sets are about people\" rule. His own selection kept\nboth. The rule is a default for when he has not chosen, not a veto on what he picks.\n\n**Claude does not know who is in any of these.** Filenames describe the scene only. The\npost line stays vague for that reason: `下面这几张里，有我和 Lina，也有我们各自的朋友`.\n\nTags: International dating / culture / Longdistancerelationship\n\n### ⚠️ The mistake this replaces\n\nThe first version of this set opened on a photo Claude labelled \"Lina on the call\". It was\nan ex of Michael's. Claude had assumed the woman in the frame was Lina and never checked.\nTwo more in that set, the ones labelled \"dinner with a friend\" and \"hanging out\", were\nLina, so the female friend slots were wrong in the other direction too.\n\nThe photo is deleted, and its content hash is pinned in `photos/EXCLUDE.md`, which\n`tools/build_photo_pool.py` now reads and drops, so it cannot come back through the picker\nunder a different name.\n\n**Identity is not inferable from a thumbnail. It gets checked at full size against a known\nreference, or it does not go in.**\n\nAlso, the camera library is not a safe folder to browse either: this search went past his\nUS passport and a purchase contract with an ID number, on top of the password entry and\nbank screen found in the screenshots on 2026-09-07.\n\nTags: International dating / culture / Longdistancerelationship","rating":"Score: 9/10, ready to post. Nine photos are in, so the hard rule is met.","direction":"Two follow-ups are sitting in this material if you want them. One: what the women actually\nsay next, after the opener, which you would know and nobody else does. Two: the reverse\nquestion, whether Lina gets the same thing from men and whether it looks different. The\nsecond one is probably the stronger post, and it would be better in her words than yours."}],"state":{"001":{"status":"old","notes":"","version":null,"postedAt":null},"002":{"status":"old","notes":"","version":null,"postedAt":null},"003":{"status":"old","notes":"","version":null,"postedAt":null},"004":{"status":"old","notes":"","version":null,"postedAt":null},"005":{"status":"old","notes":"","version":null,"postedAt":null},"006":{"status":"old","notes":"","version":null,"postedAt":null},"007":{"status":"posted","notes":"I don't know. This post doesn't really feel like me, to be honest. I think the way I had said it is closer to how I wanted to say it from my original context, but basically saying, \"Lina and I have both been getting reached out to by different people.\" Maybe we can have the initial P.O. be like, \"It's not necessarily a cultural difference. Maybe he's either uninterested or an asshole,\" or something like that. I don't necessarily like the way you built this up. You put a lot of words in my mouth that I didn't say. I just want you to basically rephrase what I say a little bit instead of what you put here. I don't know. Let's talk about this one.\n\nOr, if you're important to him he will make time. If he doesn't respond for a week you are not.","version":"A","postedAt":"2026-09-01"},"008":{"status":"todo","notes":"","version":null,"postedAt":null},"009":{"status":"posted","notes":"","version":null,"postedAt":"2026-09-02"},"010":{"status":"todo","notes":"","version":null,"postedAt":null},"011":{"status":"todo","not <script id="app-store">
/* Storage for the michaelcastelein.com build.
   The page is a static file, so the browser talks to Supabase directly with the
   publishable key. That key is public by design; Row Level Security in the
   hellotalk schema is what keeps the drafts private. */
(function(){
  "use strict";
  var SUPABASE_URL = "https://vfybjvkwsfulavczxboa.supabase.co";
  var SUPABASE_KEY = "sb_publishable_-Uiz8yVzCom7ex1Jq2d3KA_0tJDUjoG";
  var SCHEMA = "hellotalk";

  var client = null, DATA = null, uid = null, knownIdeaIds = [];

  function isUuid(v){ return /^[0-9a-f]{8}-[0-9a-f]{4}-/i.test(String(v || "")); }
  function fail(r){ if(r && r.error) throw r.error; return r; }

  function load(){
    return Promise.all([
      client.from("queue_state").select("post_id,status,notes,version,posted_at,scheduled_for,sort_order,photos"),
      client.from("queue_ideas").select("id,body,created_at").order("created_at", {ascending:true})
    ]).then(function(res){
      var rows = fail(res[0]).data || [];
      var ideaRows = fail(res[1]).data || [];

      var state = {};
      rows.forEach(function(r){
        state[r.post_id] = {
          status: r.status, notes: r.notes || "",
          version: r.version, postedAt: r.posted_at,
          scheduledFor: r.scheduled_for
        };
        // Only set `photos` when there is a real pick. queue.js treats the key's
        // absence as "use the suggested set", so an empty array would read as
        // "he deliberately chose nothing".
        if(Array.isArray(r.photos) && r.photos.length) state[r.post_id].photos = r.photos;
      });

      var order = rows.slice().sort(function(a, b){
        return (a.sort_order - b.sort_order) || (a.post_id < b.post_id ? -1 : 1);
      }).map(function(r){ return r.post_id; });

      var ideas = ideaRows.map(function(r){
        return {id: r.id, text: r.body, ts: String(r.created_at || "").slice(0, 10)};
      });
      knownIdeaIds = ideas.map(function(i){ return i.id; });

      return {state: state, order: order, ideas: ideas};
    });
  }

  // Every post is upserted on every save. Fourteen small rows is cheaper than
  // getting change-tracking subtly wrong. `owner` is left out on purpose so the
  // column default (auth.uid()) fills it and RLS cannot be talked into
  // accepting someone else's id.
  function pushState(D){
    var rows = D.order.map(function(id, i){
      var s = D.state[id] || {};
      return {
        post_id: id,
        status: s.status || "todo",
        notes: s.notes || "",
        version: s.version || null,
        posted_at: s.postedAt || null,
        scheduled_for: s.scheduledFor || null,
        sort_order: i,
        photos: (s.photos && s.photos.length) ? s.photos : null
      };
    });
    if(!rows.length) return Promise.resolve();
    return client.from("queue_state").upsert(rows, {onConflict: "post_id"}).then(fail);
  }

  function pushIdeas(D){
    var fresh = D.ideas.filter(function(x){ return !isUuid(x.id); });
    var kept = D.ideas.filter(function(x){ return isUuid(x.id); }).map(function(x){ return x.id; });
    var gone = knownIdeaIds.filter(function(id){ return kept.indexOf(id) === -1; });

    var steps = Promise.resolve();
    if(gone.length){
      steps = steps.then(function(){
        return client.from("queue_ideas").delete().in("id", gone).then(fail);
      });
    }
    if(fresh.length){
      steps = steps.then(function(){
        return client.from("queue_ideas")
          .insert(fresh.map(function(x){ return {body: x.text}; }))
          .then(fail);
      });
    }
    if(!gone.length && !fresh.length) return steps;

    // Re-read so the locally invented ids are replaced by real ones and the
    // list stays in step with the table.
    return steps.then(function(){
      return client.from("queue_ideas").select("id,body,created_at")
        .order("created_at", {ascending:true}).then(fail);
    }).then(function(res){
      var ideas = (res.data || []).map(function(r){
        return {id: r.id, text: r.body, ts: String(r.created_at || "").slice(0, 10)};
      });
      D.ideas.length = 0;
      ideas.forEach(function(i){ D.ideas.push(i); });
      knownIdeaIds = ideas.map(function(i){ return i.id; });
    });
  }

  window.QUEUE_STORE = {
    // Shown only when a save fails. It reads as a session problem because
    // that is what it almost always is: the gate blocks every other path.
    label: "Not saved. Your session may have expired, so reload and sign in again.",

    attach: function(D){ DATA = D; },

    boot: function(){
      if(!(window.supabase && window.supabase.createClient)){
        return Promise.resolve({gate: {reason: "lib"}});
      }
      client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        db: {schema: SCHEMA},
        auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true}
      });
      return client.auth.getSession().then(function(res){
        var session = res && res.data && res.data.session;
        if(!session || !session.user) return {gate: {reason: "signin"}};
        uid = session.user.id;
        return load().then(function(data){ return {data: data}; });
      });
    },

    // Claude can read the artifact's HTML but not this page's database, so this
    // build is the one that needs a way to hand the board over. See exportBar().
    canExport: true,

    persist: function(D){
      if(!client || !uid) return Promise.reject({message: "not signed in"});
      return pushState(D).then(function(){ return pushIdeas(D); });
    },

    renderGate: function(root){
      root.innerHTML =
        '<div class="gate">'
      +   '<h1>HelloTalk Post Queue</h1>'
      +   '<p>Private. Sign in to load your marks and notes.</p>'
      +   '<form id="gate-form">'
      +     '<input id="gate-email" type="email" inputmode="email" autocomplete="username" '
      +       'placeholder="you@example.com" required>'
      +     '<input id="gate-pw" type="password" autocomplete="current-password" '
      +       'placeholder="Password" required>'
      +     '<button type="submit">Sign in</button>'
      +   '</form>'
      +   '<p class="msg" id="gate-msg" hidden></p>'
      +   '<p class="alt"><button type="button" id="gate-otp">Email me a one-time link instead</button></p>'
      +   '<p class="fine">Marks, notes and order live in Supabase behind row '
      +     'level security. No session, no rows.</p>'
      + '</div>';

      var form = document.getElementById("gate-form");
      var email = document.getElementById("gate-email");
      var pw = document.getElementById("gate-pw");
      var msg = document.getElementById("gate-msg");
      var btn = form.querySelector("button");
      var otpBtn = document.getElementById("gate-otp");

      function say(text, bad){
        msg.textContent = text;
        msg.className = "msg" + (bad ? " bad" : "");
        msg.hidden = false;
      }
      function busy(on){ btn.disabled = on; otpBtn.disabled = on; }

      // A fresh session has to re-read the board, so just reload: boot() then
      // finds the session and loads the rows. Simpler than re-running start().
      function signedIn(){ location.reload(); }

      form.addEventListener("submit", function(e){
        e.preventDefault();
        var addr = email.value.trim();
        if(!addr || !pw.value) return;
        busy(true);
        say("Signing in…");
        client.auth.signInWithPassword({email: addr, password: pw.value}).then(function(res){
          busy(false);
          if(res.error){ say(res.error.message, true); return; }
          signedIn();
        }, function(err){
          busy(false);
          say((err && err.message) || "Could not sign in", true);
        });
      });

      // Kept because it works and needs no remembered password. It just
      // depends on the email arriving, which is why it is not the default.
      otpBtn.addEventListener("click", function(){
        var addr = email.value.trim();
        if(!addr){ say("Type your email first, then tap this.", true); email.focus(); return; }
        busy(true);
        say("Sending…");
        client.auth.signInWithOtp({
          email: addr,
          options: {emailRedirectTo: location.href.split("#")[0]}
        }).then(function(res){
          busy(false);
          if(res.error){ say(res.error.message, true); return; }
          say("Check " + addr + ". Open the link on this device. It signs you in and comes straight back here.");
        }, function(err){
          busy(false);
          say((err && err.message) || "Could not send the link", true);
        });
      });
    }
  };
})();
</script>
<script id="app-js">(function(){
"use strict";
var TITLE = "HelloTalk Post Queue";
var D = JSON.parse(document.getElementById("app-data").textContent);
D.state = D.state || {};
D.ideas = D.ideas || [];
D.order = D.order || D.posts.map(function(p){ return p.id; });

var UI = {filter:"all", q:"", open:{}, both:true, focusFind:false, view:"list", cal:null, pick:null, extras:false};
try{ var saved = localStorage.getItem("htq-ui"); if(saved) UI = Object.assign(UI, JSON.parse(saved)); }catch(e){}
function keepUI(){ try{ localStorage.setItem("htq-ui", JSON.stringify(UI)); }catch(e){} }

function st(id){
  if(!D.state[id]) D.state[id] = {status:"todo", notes:"", version:null, postedAt:null, scheduledFor:null};
  return D.state[id];
}
// ---------- photo picker ----------
// The pool and the assigned sets are embedded by build_page.py --photos. When
// they are absent the button never renders, so the page still works without them.
function pool(){ return (D.photos && D.photos.pool) || []; }
// One group per folder under Pictures\HelloTalk Photos, built by
// tools/build_photo_pool.py. Empty folders are left out, so the chips only
// ever show folders that actually hold something.
function groups(){ return (D.photos && D.photos.groups) || []; }
function poolById(){
  if(!D._pmap){ D._pmap = {}; pool().forEach(function(x){ D._pmap[x.id] = x; }); }
  return D._pmap;
}
function assigned(id){ return (D.photos && D.photos.sets && D.photos.sets[id]) || []; }

// His chosen nine, falling back to whatever Claude assigned. Kept on state so it
// saves and republishes like every other mark on this page.
function chosen(id){
  var s = st(id);
  if(s.photos && s.photos.length) return s.photos.slice();
  return assigned(id).slice();
}
function setChosen(id, list){
  var s = st(id), base = assigned(id);
  var same = list.length === base.length && list.every(function(x, i){ return x === base[i]; });
  if(same) delete s.photos;          // identical to the suggested set, store nothing
  else s.photos = list.slice();
  save();
}

function byId(id){
  for(var i = 0; i < D.posts.length; i++){ if(D.posts[i].id === id) return D.posts[i]; }
  return null;
}
function ordered(){
  var out = [], seen = {};
  D.order.forEach(function(id){ var p = byId(id); if(p && !seen[id]){ seen[id] = 1; out.push(p); } });
  D.posts.forEach(function(p){ if(!seen[p.id]) out.push(p); });
  return out;
}
function esc(t){ return String(t == null ? "" : t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ---------- dates ----------
   Everything is a plain "YYYY-MM-DD" string. Date objects are built at noon so
   a timezone shift can never roll a post onto the day before. */
function ymd(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function fromYMD(s){
  var a = String(s || "").split("-");
  return new Date(+a[0], +a[1] - 1, +a[2], 12, 0, 0);
}
function addDays(s, n){
  var d = fromYMD(s); d.setDate(d.getDate() + n); return ymd(d);
}
function monthOf(s){ return String(s || "").slice(0, 7); }
function shiftMonth(m, n){
  var a = m.split("-"), d = new Date(+a[0], +a[1] - 1 + n, 1, 12, 0, 0);
  return ymd(d).slice(0, 7);
}
var MONTHS = ["January","February","March","April","May","June",
              "July","August","September","October","November","December"];
function monthLabel(m){
  var a = m.split("-");
  return MONTHS[+a[1] - 1] + " " + a[0];
}
// Monday first: he lives between Europe and China and both start there.
function monthGrid(m){
  var a = m.split("-"), first = new Date(+a[0], +a[1] - 1, 1, 12, 0, 0);
  var lead = (first.getDay() + 6) % 7;
  var start = new Date(first); start.setDate(start.getDate() - lead);
  var out = [];
  for(var i = 0; i < 42; i++){
    var d = new Date(start); d.setDate(start.getDate() + i);
    out.push({date: ymd(d), inMonth: monthOf(ymd(d)) === m});
  }
  // Drop a trailing all-next-month week so short months do not show six rows.
  if(out.slice(35).every(function(c){ return !c.inMonth; })) out = out.slice(0, 35);
  return out;
}
function scheduleDay(p){
  var s = st(p.id);
  return s.status === "posted" ? (s.postedAt || null) : (s.scheduledFor || null);
}
function postOnDay(day){
  var hit = null;
  ordered().forEach(function(p){ if(!hit && scheduleDay(p) === day) hit = p; });
  return hit;
}
// Waiting posts with no day yet, in queue order. This is the tray.
function unscheduled(){
  return ordered().filter(function(p){
    var s = st(p.id);
    return s.status === "todo" && !s.scheduledFor;
  });
}
function today(){ var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }

/* ---------- persistence ----------
   The page does not know or care where state lives. Each build supplies a
   window.QUEUE_STORE before this script runs:

     attach(D)       -> void                     optional; hands over the live data object
     boot()          -> Promise<{data?, gate?}>  optional; data merges in
     persist(D)      -> Promise                  called after every change
     label           string                      shown when persist is missing
*/
var STORE = window.QUEUE_STORE || {};
var storeBroken = false;
if(typeof STORE.attach === "function") STORE.attach(D);

function pill(msg, warn){
  var p = document.getElementById("pill");
  if(!p) return;
  p.textContent = msg;
  p.className = "pill on" + (warn ? " warn" : "");
  clearTimeout(pill.t);
  pill.t = setTimeout(function(){ p.className = "pill" + (warn ? " warn" : ""); }, warn ? 6000 : 1800);
}

var timer = null, dirty = false;
function save(){
  dirty = true;
  clearTimeout(timer);
  timer = setTimeout(flush, 700);

function flush(){
  if(!dirty) return;
  if(typeof STORE.persist !== "function"){
    if(!storeBroken){ storeBroken = true; pill(STORE.label || "Changes are not saving here", true); }
    return;
  }
  dirty = false;
  pill("Saving\u2026");
  STORE.persist(D).then(function(){ pill("Saved"); }, function(err){
    dirty = true;
    pill("Could not save \u2014 " + ((err && (err.message || err.code)) || "unknown error"), true);

}

document.addEventListener("visibilitychange", function(){ if(document.hidden) flush(); });

// Remote state wins over whatever the build baked in: the build only knows the
// marks as of its last run, the store knows what Michael did since.
function mergeRemote(remote){
  if(!remote) return;
  // A store nobody has written yet answers with nothing at all. Keep whatever
  // the build baked in so the first save seeds it, instead of blanking the
  // board on the very first sign-in. (`remote.ideas` is [] there, and [] is
  // truthy, so without this the captured ideas were dropped.)
  if(!Object.keys(remote.state || {}).length
     && !(remote.order || []).length
     && !(remote.ideas || []).length) return;
  if(remote.state){
    Object.keys(remote.state).forEach(function(id){
      var r = remote.state[id];
      var s = st(id);
      if(r.status) s.status = r.status;
      if(r.notes !== undefined && r.notes !== null) s.notes = r.notes;
      if(r.version !== undefined) s.version = r.version;
      if(r.postedAt !== undefined) s.postedAt = r.postedAt;
      if(r.scheduledFor !== undefined) s.scheduledFor = r.scheduledFor;
    });
  }
  if(remote.order && remote.order.length) D.order = remote.order;
  if(remote.ideas) D.ideas = remote.ideas;
}

/* ---------- clipboard ---------- */
function legacyCopy(text){
  try{
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.top = "0"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}
function copy(text, btn){
  function done(ok){
    if(!btn) return;
    if(!btn.dataset.label) btn.dataset.label = btn.textContent;
    btn.textContent = ok ? "Copied ✓" : "Copy failed";
    btn.classList.toggle("ok", ok);
    setTimeout(function(){ btn.textContent = btn.dataset.label; btn.classList.remove("ok"); }, 1400);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ done(legacyCopy(text)); });
  } else {
    done(legacyCopy(text));
  }
}

/* ---------- helpers ---------- */
function versionsOf(p){ return p.versions || []; }
function pickVersion(p){
  var v = versionsOf(p), s = st(p.id), i;
  if(!v.length) return {key:"", label:"", zh:"", en:""};
  if(s.version){
    for(i = 0; i < v.length; i++){ if(v[i].key === s.version) return v[i]; }
  }
  return v[0];
}
function nextUpId(){
  var list = ordered();
  for(var i = 0; i < list.length; i++){
    if(st(list[i].id).status === "todo") return list[i].id;
  }
  return null;
}
function pollLines(txt){
  var out = {q:"", opts:[]};
  String(txt || "").split(/\n+/).forEach(function(l){
    l = l.trim();
    if(!l) return;
    if(/^[A-Ea-e][\)）\.．]/.test(l)) out.opts.push(l);
    else if(!out.q) out.q = l;
  });
  return out;
}
function counts(){
  var c = {all:D.posts.length, todo:0, posted:0, skipped:0, old:0, notes:0};
  D.posts.forEach(function(p){
    var s = st(p.id);
    c[s.status === "posted" ? "posted" : s.status === "skipped" ? "skipped" : s.status === "old" ? "old" : "todo"]++;
    if(s.notes && s.notes.trim()) c.notes++;
  });
  return c;
}
function matches(p){
  var s = st(p.id);
  if(UI.filter === "todo" && s.status !== "todo") return false;
  if(UI.filter === "posted" && s.status !== "posted") return false;
  if(UI.filter === "skipped" && s.status !== "skipped") return false;
  if(UI.filter === "old" && s.status !== "old") return false;
  if(UI.filter === "notes" && !(s.notes && s.notes.trim())) return false;
  var q = UI.q.trim().toLowerCase();
  if(!q) return true;
  var hay = [p.id, p.title, s.notes || ""];
  versionsOf(p).forEach(function(v){ hay.push(v.zh, v.en); });
  if(p.comment) hay.push(p.comment.zh, p.comment.en);
  if(p.poll) hay.push(p.poll.zh, p.poll.en);
  return hay.join(" ").toLowerCase().indexOf(q) > -1;
}
// Dragging only makes sense against the whole list in its real order.
function canReorder(){ return UI.filter === "all" && !UI.q.trim(); }

/* ---------- handing the board back to Claude ---------- */
// Claude cannot read this page's database: row level security is scoped to
// Michael's login and only the publishable key is on his machine. So his marks,
// notes and photo picks were invisible, and on 2026-09-08 a set of nine picks had
// to be recovered from a screenshot twice. This button writes the whole board to a
// file in his Downloads folder, which Claude can read directly.
function exportBar(){
  if(!(window.QUEUE_STORE && window.QUEUE_STORE.canExport)) return "";
  return '<div class="exportbar">'
    + '<button class="ghost" id="dumpstate">Save board for Claude</button>'
    + '<span class="hint">Downloads one small file. Tell Claude and it reads it.</span>'
    + '</div>';
}

function dumpState(){
  var blob = {kind: "hellotalk-queue-state", saved: new Date().toISOString(),
              generated: D.generated, order: D.order, state: D.state, ideas: D.ideas};
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(blob, null, 1)],
                                        {type: "application/json"}));
  a.download = "hellotalk-queue-state.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  pill("Saved. Tell Claude to read it.");
}

/* ---------- drag to reorder ---------- */
var drag = null;

function placeDragged(){
  if(!drag) return;
  var list = document.getElementById("list");
  if(!list) return;
  var y = drag.y, target = null;
  var kids = Array.prototype.slice.call(list.children);
  for(var i = 0; i < kids.length; i++){
    var el = kids[i];
    if(el === drag.card || !el.classList.contains("card")) continue;
    var r = el.getBoundingClientRect();
    if(y < r.top + r.height / 2){ target = el; break; }
  }
  if(target){ if(drag.card.nextElementSibling !== target) list.insertBefore(drag.card, target); }
  else if(list.lastElementChild !== drag.card){ list.appendChild(drag.card); }
}

function dragTick(){
  if(!drag) return;
  var pad = 96;
  if(drag.y < pad) window.scrollBy(0, -Math.min(16, (pad - drag.y) / 4));
  else if(drag.y > window.innerHeight - pad) window.scrollBy(0, Math.min(16, (drag.y - (window.innerHeight - pad)) / 4));
  placeDragged();
  drag.raf = requestAnimationFrame(dragTick);
}

document.addEventListener("pointerdown", function(e){
  var g = e.target.closest ? e.target.closest(".grip") : null;
  if(!g) return;
  if(!canReorder()){ pill("Switch to All and clear the search to reorder", true); return; }
  var card = g.closest(".card");
  if(!card) return;
  e.preventDefault();
  try{ g.setPointerCapture(e.pointerId); }catch(err){}
  drag = {card:card, pid:e.pointerId, y:e.clientY, grip:g, raf:0};
  card.classList.add("dragging");
  document.body.classList.add("is-dragging");
  drag.raf = requestAnimationFrame(dragTick);
});

document.addEventListener("pointermove", function(e){
  if(!drag || e.pointerId !== drag.pid) return;
  e.preventDefault();
  drag.y = e.clientY;
});

function endDrag(){
  if(!drag) return;
  cancelAnimationFrame(drag.raf);
  drag.card.classList.remove("dragging");
  document.body.classList.remove("is-dragging");
  var list = document.getElementById("list");
  var next = [];
  Array.prototype.forEach.call(list.children, function(el){
    if(el.dataset && el.dataset.id) next.push(el.dataset.id);
  });
  var changed = next.join(",") !== D.order.join(",");
  drag = null;
  if(changed){
    D.order = next;
    render();
    save();
    pill("New order saved");
  }
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);

/* ---------- events ---------- */
document.addEventListener("click", function(e){
  var t = e.target.closest ? e.target.closest("button") : null;
  if(!t || t.classList.contains("grip")) return;

  if(t.dataset.filter){ UI.filter = t.dataset.filter; UI.focusFind = false; keepUI(); render(); return; }

  if(t.dataset.view){ UI.view = t.dataset.view; UI.pick = null; UI.focusFind = false; keepUI(); render(); return; }
  if(t.dataset.cal){ UI.cal = t.dataset.cal; keepUI(); render(); return; }

  if(t.dataset.pick){
    UI.pick = (UI.pick === t.dataset.pick) ? null : t.dataset.pick;
    render();
    return;
  }

  if(t.dataset.unschedule){
    st(t.dataset.unschedule).scheduledFor = null;
    render();
    save();
    return;
  }

  // Every waiting post that has no day yet, one per free day, starting tomorrow.
  if(t.id === "calfill"){
    var taken = {};
    D.posts.forEach(function(p){ var d = scheduleDay(p); if(d) taken[d] = 1; });
    var day = addDays(today(), 1);
    unscheduled().forEach(function(p){
      while(taken[day]) day = addDays(day, 1);
      st(p.id).scheduledFor = day;
      taken[day] = 1;
      day = addDays(day, 1);
    });
    render();
    save();
    return;
  }

  // Only future days. A posted day is a fact, not a plan.
  if(t.id === "calclear"){
    var n = 0;
    D.posts.forEach(function(p){
      var s = st(p.id);
      if(s.scheduledFor && s.scheduledFor >= today() && s.status !== "posted"){ s.scheduledFor = null; n++; }
    });
    render();
    if(n) save();
    return;
  }

  if(t.id === "lang"){ UI.both = !UI.both; UI.focusFind = false; keepUI(); render(); return; }

  if(t.id === "extras"){ UI.extras = !UI.extras; UI.focusFind = false; keepUI(); render(); return; }
  if(t.dataset.extras){ UI.extras = true; UI.focusFind = false; keepUI(); render(); return; }

  if(t.dataset.toggle){
    var id = t.dataset.toggle;
    UI.open[id] = !UI.open[id];
    UI.focusFind = false;
    keepUI();
    render();
    if(UI.open[id]){
      var el = document.getElementById("c" + id);
      if(el) el.scrollIntoView({block:"start", behavior:"smooth"});
    }
    return;
  }

  if(t.dataset.copy){
    var src = document.getElementById("src-" + t.dataset.copy);
    if(src) copy(src.textContent, t);
    return;
  }
  if(t.classList.contains("opt")){ copy(t.dataset.copytext, t); return; }

  if(t.dataset.ver){
    var a = t.dataset.ver.split("|");
    st(a[0]).version = a[1];
    UI.focusFind = false;
    render();
    save();
    return;
  }

  if(t.dataset.status){
    var b = t.dataset.status.split("|");
    var s = st(b[0]);
    s.status = b[1];
    s.postedAt = (b[1] === "posted") ? (s.postedAt || today()) : null;
    UI.focusFind = false;
    render();
    save();
    return;
  }

  if(t.dataset.clearnote){
    st(t.dataset.clearnote).notes = "";
    UI.focusFind = false;
    render();
    save();
    return;
  }

  if(t.id === "ideaadd"){
    var box = document.getElementById("ideabox");
    var txt = box ? box.value.trim() : "";
    if(!txt){ if(box) box.focus(); return; }
    D.ideas.push({id:"i" + Date.now(), text:txt, ts:today()});
    if(box) box.value = "";
    UI.focusFind = false;
    render();
    save();
    return;
  }

  if(t.dataset.idea){
    var gone = t.dataset.idea;
    D.ideas = D.ideas.filter(function(x){ return x.id !== gone; });
    UI.focusFind = false;
    render();
    save();
    return;
  }
});

// Tap a day: place the picked post, or pick up the one already there.
document.addEventListener("click", function(e){
  if(UI.view !== "calendar") return;
  var cell = e.target.closest ? e.target.closest(".day") : null;
  if(!cell) return;
  if(e.target.closest("button")) return;
  var day = cell.dataset.day;
  if(UI.pick){
    var sitting = postOnDay(day);
    if(sitting && st(sitting.id).status === "posted") return;
    if(sitting) st(sitting.id).scheduledFor = null;
    st(UI.pick).scheduledFor = day;
    UI.pick = null;
    render();
    save();
    return;
  }
  var p = postOnDay(day);
  if(p && st(p.id).status !== "posted"){ UI.pick = p.id; render(); }
});

/* ---------- drag a post onto a day (laptop only, tapping covers phones) ---------- */
document.addEventListener("dragstart", function(e){
  var chip = e.target.closest ? e.target.closest("[data-pick]") : null;
  if(!chip) return;
  UI.pick = chip.dataset.pick;
  try{ e.dataTransfer.setData("text/plain", chip.dataset.pick); e.dataTransfer.effectAllowed = "move"; }catch(x){}
});
document.addEventListener("dragover", function(e){
  if(UI.view !== "calendar" || !UI.pick) return;
  var cell = e.target.closest ? e.target.closest(".day") : null;
  if(!cell) return;
  e.preventDefault();
  cell.classList.add("over");
});
document.addEventListener("dragleave", function(e){
  var cell = e.target.closest ? e.target.closest(".day") : null;
  if(cell) cell.classList.remove("over");
});
document.addEventListener("drop", function(e){
  if(UI.view !== "calendar") return;
  var cell = e.target.closest ? e.target.closest(".day") : null;
  if(!cell || !UI.pick) return;
  e.preventDefault();
  var day = cell.dataset.day, sitting = postOnDay(day);
  if(sitting && st(sitting.id).status === "posted"){ UI.pick = null; render(); return; }
  if(sitting) st(sitting.id).scheduledFor = null;
  st(UI.pick).scheduledFor = day;
  UI.pick = null;
  render();
  save();
});

document.addEventListener("input", function(e){
  if(e.target.id === "find"){
    UI.q = e.target.value;
    UI.focusFind = true;
    keepUI();
    clearTimeout(render.ft);
    render.ft = setTimeout(render, 220);
  }
});

document.addEventListener("change", function(e){
  var d = e.target.dataset;
  if(d && d.note){
    var val = e.target.value;
    if(st(d.note).notes !== val){
      st(d.note).notes = val;
      save();
    }
  }
});

function start(){
  render();
  if(typeof STORE.boot !== "function") return;
  STORE.boot().then(function(res){
    if(!res) return;
    if(res.gate && typeof STORE.renderGate === "function"){
      STORE.renderGate(document.getElementById("root"));
      return;
    }
    mergeRemote(res.data);
    render();
  }, function(err){
    pill("Could not load \u2014 " + ((err && (err.message || err.code)) || "unknown error"), true);
  });
}

start();



// ---------- the photo picker sheet ----------
// A full screen overlay rather than a second page: the queue is published as a
// single artifact, so there is nowhere else to link to. The first picker was a
// separate 4 MB file hand built for draft 018 and could not be reused.
var PICK = null;   // {id, list, g}   g = "" for every folder at once

function openPicker(id){
  PICK = {id: id, list: chosen(id), g: ""};
  drawPicker();
}
function closePicker(){
  PICK = null;
  var el = document.getElementById("sheet");
  if(el) el.remove();
  document.body.classList.remove("sheet-open");
  render();
}

function drawPicker(){
  if(!PICK) return;
  var amap = poolById(), list = PICK.list;
  var p = byId(PICK.id) || {title: PICK.id};
  var el = document.getElementById("sheet");
  if(!el){
    el = document.createElement("div");
    el.id = "sheet";
    document.body.appendChild(el);
    document.body.classList.add("sheet-open");
  }

  var h = '<div class="sheetbar">'
    + '<button class="ghost" id="sheetclose">Done</button>'
    + '<b>' + esc(PICK.id) + ' · ' + list.length + ' of 9</b>'
    + '<button class="ghost" id="sheetreset">Suggested</button>'
    + '</div>';

  h += '<div class="sheetbody">';
  h += '<p class="label">Picked, in order. Tap one to drop it.</p><div class="chosen">';
  if(!list.length){
    h += '<span class="hint">Nothing picked. Tap photos below.</span>';
  } else {
    list.forEach(function(pid, i){
      var ph = amap[pid];
      h += '<button class="shot pickd" data-drop="' + i + '" aria-label="Remove photo ' + (i+1) + '">'
        + (ph ? '<img src="' + ph.src + '" alt="">' : '<span class="gone">?</span>')
        + '<span class="slot">' + (i + 1) + '</span></button>';
    });
  }
  h += '</div>';

  var gs = groups(), shown = pool();
  if(PICK.g) shown = shown.filter(function(ph){ return ph.g === PICK.g; });
  if(gs.length > 1){
    h += '<div class="chips folders">'
      + '<button class="chip" data-fold="" aria-pressed="' + (!PICK.g) + '">All<b>'
      + pool().length + '</b></button>';
    gs.forEach(function(g){
      h += '<button class="chip" data-fold="' + esc(g.key) + '" aria-pressed="'
        + (PICK.g === g.key) + '">' + esc(g.label) + '<b>' + g.n + '</b></button>';
    });
    h += '</div>';
  }

  h += '<p class="label">' + shown.length + ' to choose from. Tap to add.</p><div class="grid2">';
  if(!shown.length){
    h += '<span class="hint">That folder is empty. Drop photos into it on the laptop, '
      + 'then rebuild the pool.</span>';
  }
  shown.forEach(function(ph){
    var at = list.indexOf(ph.id);
    h += '<button class="cell2" data-add="' + ph.id + '" aria-pressed="' + (at > -1) + '">'
      + '<img src="' + ph.src + '" alt="" loading="lazy">'
      + (at > -1 ? '<span class="slot">' + (at + 1) + '</span>' : '')
      + '</button>';
  });
  h += '</div></div>';

  el.innerHTML = h;
}

document.addEventListener("click", function(e){
  if(e.target.closest("#dumpstate")){ dumpState(); return; }

  var open = e.target.closest("[data-photos]");
  if(open){ openPicker(open.getAttribute("data-photos")); return; }

  if(!PICK) return;

  if(e.target.closest("#sheetclose")){ setChosen(PICK.id, PICK.list); closePicker(); return; }
  if(e.target.closest("#sheetreset")){ PICK.list = assigned(PICK.id).slice(); drawPicker(); return; }

  var fold = e.target.closest("[data-fold]");
  if(fold){ PICK.g = fold.getAttribute("data-fold"); drawPicker(); return; }

  var drop = e.target.closest("[data-drop]");
  if(drop){ PICK.list.splice(Number(drop.getAttribute("data-drop")), 1); drawPicker(); return; }

  var add = e.target.closest("[data-add]");
  if(add){
    var pid = add.getAttribute("data-add"), at = PICK.list.indexOf(pid);
    if(at > -1) PICK.list.splice(at, 1);
    else if(PICK.list.length < 9) PICK.list.push(pid);
    else pill("Nine already. Drop one first.", true);
    drawPicker();
  }
});

document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && PICK){ setChosen(PICK.id, PICK.list); closePicker(); }
});

})();</script>
