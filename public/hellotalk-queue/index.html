function pill(msg, warn){
  var p = document.getElementById("pill");
  if(!p) return;
  p.textContent = msg;
  p.className = "pill on" + (warn ? " warn" : "");
  clearTimeout(pill.t);
  pill.t = setTimeout(function(){ p.className = "pill" + (warn ? " warn" : ""); }, warn ? 6000 : 1800);

// marks as of its last run, the store knows what Michael did since.
function mergeRemote(remote){

  // the build baked in so the first save seeds it, instead of blanking the
  // board on the very first sign-in. (`remote.ideas` is [] there, and [] is
  // truthy, so without this the captured ideas were dropped.)

     && !(remote.order || []).length
     && !(remote.ideas || []).length) return;

    Object.keys(remote.state).forEach(function(id){
      var r = remote.state[id];
      var s = st(id);
      if(r.status) s.status = r.status;
      if(r.notes !== undefined && r.notes !== null) s.notes = r.notes;
      if(r.version !== undefined) s.version = r.version;
      if(r.postedAt !== undefined) s.postedAt = r.postedAt;
      if(r.scheduledFor !== undefined) s.scheduledFor = r.scheduledFor;
    });

  if(remote.ideas) D.ideas = remote.ideas;

/* ---------- clipboard ---------- */
function legacyCopy(text){
  try{
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.top = "0"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}
function copy(text, btn){
  function done(ok){
    if(!btn) return;
    if(!btn.dataset.label) btn.dataset.label = btn.textContent;
    btn.textContent = ok ? "Copied ✓" : "Copy failed";
    btn.classList.toggle("ok", ok);
    setTimeout(function(){ btn.textContent = btn.dataset.label; btn.classList.remove("ok"); }, 1400);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ done(legacyCopy(text)); });
  } else {
    done(legacyCopy(text));
  }
}

/* ---------- helpers ---------- */
function versionsOf(p){ return p.versions || []; }
function pickVersion(p){
  var v = versionsOf(p), s = st(p.id), i;
  if(!v.length) return {key:"", label:"", zh:"", en:""};
  if(s.version){
    for(i = 0; i < v.length; i++){ if(v[i].key === s.version) return v[i]; }
  }

}

    l = l.trim();

function counts(){
  var c = {all:D.posts.length, todo:0, posted:0, skipped:0, old:0, notes:0};
  D.posts.forEach(function(p){
    var s = st(p.id);
    c[s.status === "posted" ? "posted" : s.status === "skipped" ? "skipped" : s.status === "old" ? "old" : "todo"]++;

function matches(p){
  var s = st(p.id);

  if(UI.filter === "old" && s.status !== "old") return false;
  if(UI.filter === "notes" && !(s.notes && s.notes.trim())) return false;

  if(!q) return true;
  var hay = [p.id, p.title, s.notes || ""];

  if(p.comment) hay.push(p.comment.zh, p.comment.en);

/* ---------- calendar ---------- */
function calendar(){

    + '<span class="flags">';
  if(s.status === "posted") h += '<span class="stamp">已发</span>';
  if(s.status === "posted" && s.postedAt) h += '<span class="tag">' + esc(s.postedAt) + '</span>';
  if(s.status === "skipped") h += '<span class="tag skip">skipped</span>';
  if(s.status === "old") h += '<span class="tag oldtag">older idea</span>';
  if(s.status === "todo" && p.id === next) h += '<span class="tag next">next up</span>';
  if(s.notes && s.notes.trim()) h += '<span class="tag note">note</span>';
  if(vs.length > 1) h += '<span class="tag">ver ' + esc(v.key) + '</span>';
  h += '</span></span><span class="caret">▾</span></button></div>';

  h += '<div class="marks">'
    + '<button class="mt" data-status="' + esc(p.id) + '|todo" aria-pressed="' + (s.status === "todo") + '">Waiting</button>'
    + '<button class="mp" data-status="' + esc(p.id) + '|posted" aria-pressed="' + (s.status === "posted") + '">Posted</button>'
    + '<button class="ms" data-status="' + esc(p.id) + '|skipped" aria-pressed="' + (s.status === "skipped") + '">Skip</button>'
    + '<button class="mo" data-status="' + esc(p.id) + '|old" aria-pressed="' + (s.status === "old") + '">Old</button>'
    + '</div>';

  if(open){
    h += '<div class="body">';

    if(vs.length > 1){
      h += '<div class="seg">';
      vs.forEach(function(x){
        h += '<button data-ver="' + esc(p.id) + '|' + esc(x.key) + '" aria-pressed="' + (x.key === v.key) + '">' + esc(x.label) + '</button>';
      });
      h += '</div>';
    }

    h += block("Main post", v.zh, v.en, p.id + "-main", true);

    // Off by default. He reads the post itself far more often than the extras.
    if(UI.extras && p.comment && p.comment.zh){
      h += block("First comment", p.comment.zh, p.comment.en, p.id + "-cmt", false);
    }

    if(UI.extras && p.poll && p.poll.zh){
      var pl = pollLines(p.poll.zh);
      h += '<div class="block"><header><h3>Poll</h3>'
        + '<button class="copy" data-copy="' + esc(p.id) + '-poll">Copy all</button></header>';
      if(pl.opts.length){
        // Question and translation side by side, options as tap-to-copy chips.
        // The full Chinese text stays hidden so "Copy all" hands over everything.
        h += pair(pl.q, p.poll.en, p.id + "-pollq", true)
          + '<span hidden id="src-' + esc(p.id) + '-poll">' + esc(p.poll.zh) + '</span>'
          + '<div class="opts">';
        pl.opts.forEach(function(o){
          h += '<button class="opt" data-copytext="' + esc(o.replace(/^[A-Ea-e][\)）\.．]\s*/, "")) + '">' + esc(o) + '</button>';
        });
        h += '</div><div class="opts"><span class="hint">Tap an option to copy that line only.</span></div>';
      } else {
        h += pair(p.poll.zh, p.poll.en, p.id + "-poll", true);
      }
      h += '</div>';
    }

    if(!UI.extras && ((p.comment && p.comment.zh) || (p.poll && p.poll.zh))){
      h += '<div class="opts"><button class="ghost" data-extras="1">Show first comment and poll</button></div>';
    }

    if(p.picture) h += '<p class="hint"><b>Photo idea:</b> ' + esc(p.picture) + '</p>';
    if(p.rating) h += '<p class="hint"><b>Rating:</b> ' + esc(p.rating) + '</p>';
    if(p.direction) h += '<p class="hint"><b>Claude asked:</b> ' + esc(p.direction) + '</p>';

    h += '<div><p class="label">Your edit notes</p>'
      + '<textarea class="notes" data-note="' + esc(p.id) + '" placeholder="What you want changed before this goes out…">' + esc(s.notes) + '</textarea>'
      + '<div class="noterow"><span class="meta">Saves when you tap away</span>'
      + '<button class="ghost" data-clearnote="' + esc(p.id) + '">Clear</button></div></div>';

    h += '<p class="meta">posts/' + (s.status === "posted" ? "posted" : "drafts") + '/' + esc(p.file) + '</p>';
    h += '</div>';
  }
  h += '</article>';
  return h;
}

function render(){
  var c = counts(), next = nextUpId();
  var pct = function(n){ return c.all ? (n / c.all * 100) : 0; };
  var h = "";

  h += '<div class="head">'
    + '<p class="eyebrow">HelloTalk · drafts → posted</p>'
    + '<h1>Post Queue</h1>'
    + '<div class="tally">'
    + '<span class="unit"><b>' + c.posted + '</b><span>posted</span></span>'
    + '<span class="unit"><b>' + c.todo + '</b><span>waiting</span></span>'
    + '<span class="unit"><b>' + c.old + '</b><span>older</span></span>'
    + '<span class="unit"><b>' + c.skipped + '</b><span>skipped</span></span>'
    + '<span class="unit"><b>' + c.notes + '</b><span>with notes</span></span>'
    + '</div>'
    + '<div class="rail"><i class="done" style="width:' + pct(c.posted) + '%"></i>'
    + '<i class="oldbar" style="width:' + pct(c.old) + '%"></i>'
    + '<i class="skip" style="width:' + pct(c.skipped) + '%"></i></div>'
    + '</div>';

  var chips = [["all","All",c.all],["todo","Waiting",c.todo],["posted","Posted",c.posted],
               ["old","Older",c.old],["skipped","Skipped",c.skipped],["notes","Has notes",c.notes]];
  h += '<div class="tools"><div class="chips">';
  chips.forEach(function(k){
    h += '<button class="chip" data-filter="' + k[0] + '" aria-pressed="' + (UI.filter === k[0]) + '">' + k[1] + '<b>' + k[2] + '</b></button>';
  });
  h += '</div><div class="row2">'
    + '<input class="find" id="find" type="search" placeholder="Search Chinese, English, notes…" value="' + esc(UI.q) + '">'
    + '<button class="lang" id="lang" aria-pressed="' + UI.both + '">' + (UI.both ? "中 + EN" : "中文") + '</button>'
    + '<button class="lang" id="extras" aria-pressed="' + UI.extras + '" title="First comment and poll">＋</button>'
    + '</div></div>';

  h += '<div class="views">'
    + '<button class="vtab" data-view="list" aria-pressed="' + (UI.view === "list") + '">List</button>'
    + '<button class="vtab" data-view="calendar" aria-pressed="' + (UI.view === "calendar") + '">Calendar</button>'
    + '</div>';

  if(UI.view === "calendar"){
    h += calendar();
    h += '<p class="foot">Built from posts/drafts · ' + esc(D.generated) + '<br>Order, marks, notes and days save into this page.</p>';
    h += '<div class="pill" id="pill"></div>';
    document.getElementById("root").innerHTML = h;
    document.body.classList.toggle("zh-only", !UI.both);
    return;
  }

  h += '<main id="list">';
  var shown = 0;
  ordered().forEach(function(p){
    if(!matches(p)) return;
    shown++;
    h += card(p, next);
  });
  if(!shown) h += '<p class="empty">Nothing matches that filter.</p>';
  h += '</main>';
  if(!canReorder()) h += '<p class="hint" style="margin-top:10px">Switch to <b>All</b> and clear the search to drag posts into a new order.</p>';

  h += '<section class="ideas"><h2>Idea inbox</h2>'
    + '<p class="hint">Drop a raw idea here from your phone. Claude reads this list and turns them into drafts.</p>'
    + '<textarea class="notes" id="ideabox" placeholder="e.g. the taxi driver who refused to use the meter…"></textarea>'
    + '<div class="noterow"><span class="meta">' + D.ideas.length + ' waiting</span>'
    + '<button class="copy" id="ideaadd">Add idea</button></div>';
  D.ideas.slice().reverse().forEach(function(it){
    h += '<div class="idea"><time>' + esc(it.ts) + '</time><p>' + esc(it.text) + '</p>'
      + '<button class="x" data-idea="' + esc(it.id) + '" aria-label="Delete idea">×</button></div>';
  });
  h += '</section>';

  h += '<p class="foot">Built from posts/drafts · ' + esc(D.generated) + '<br>Order, marks and notes save into this page.</p>';
  h += '<div class="pill" id="pill"></div>';

  document.getElementById("root").innerHTML = h;
  document.body.classList.toggle("zh-only", !UI.both);
  if(UI.focusFind){
    var f = document.getElementById("find");
    if(f){ f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
  }
}

/* ---------- drag to reorder ---------- */
var drag = null;

function placeDragged(){
  if(!drag) return;
  var list = document.getElementById("list");
  if(!list) return;
  var y = drag.y, target = null;
  var kids = Array.prototype.slice.call(list.children);
  for(var i = 0; i < kids.length; i++){
    var el = kids[i];
    if(el === drag.card || !el.classList.contains("card")) continue;
    var r = el.getBoundingClientRect();
    if(y < r.top + r.height / 2){ target = el; break; }
  }
  if(target){ if(drag.card.nextElementSibling !== target) list.insertBefore(drag.card, target); }
  else if(list.lastElementChild !== drag.card){ list.appendChild(drag.card); }
}

function dragTick(){
  if(!drag) return;
  var pad = 96;
  if(drag.y < pad) window.scrollBy(0, -Math.min(16, (pad - drag.y) / 4));
  else if(drag.y > window.innerHeight - pad) window.scrollBy(0, Math.min(16, (drag.y - (window.innerHeight - pad)) / 4));
  placeDragged();
  drag.raf = requestAnimationFrame(dragTick);
}

document.addEventListener("pointerdown", function(e){
  var g = e.target.closest ? e.target.closest(".grip") : null;
  if(!g) return;
  if(!canReorder()){ pill("Switch to All and clear the search to reorder", true); return; }
  var card = g.closest(".card");
  if(!card) return;
  e.preventDefault();
  try{ g.setPointerCapture(e.pointerId); }catch(err){}
  drag = {card:card, pid:e.pointerId, y:e.clientY, grip:g, raf:0};
  card.classList.add("dragging");
  document.body.classList.add("is-dragging");
  drag.raf = requestAnimationFrame(dragTick);
});

document.addEventListener("pointermove", function(e){
  if(!drag || e.pointerId !== drag.pid) return;
  e.preventDefault();
  drag.y = e.clientY;
});

function endDrag(){
  if(!drag) return;
  cancelAnimationFrame(drag.raf);
  drag.card.classList.remove("dragging");
  document.body.classList.remove("is-dragging");
  var list = document.getElementById("list");
  var next = [];
  Array.prototype.forEach.call(list.children, function(el){
    if(el.dataset && el.dataset.id) next.push(el.dataset.id);
  });
  var changed = next.join(",") !== D.order.join(",");
  drag = null;
  if(changed){
    D.order = next;
    render();
    save();
    pill("New order saved");
  }
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);

/* ---------- events ---------- */
document.addEventListener("click", function(e){
  var t = e.target.closest ? e.target.closest("button") : null;
  if(!t || t.classList.contains("grip")) return;

  if(t.dataset.filter){ UI.filter = t.dataset.filter; UI.focusFind = false; keepUI(); render(); return; }

  if(t.dataset.view){ UI.view = t.dataset.view; UI.pick = null; UI.focusFind = false; keepUI(); render(); return; }
  if(t.dataset.cal){ UI.cal = t.dataset.cal; keepUI(); render(); return; }

  if(t.dataset.pick){
    UI.pick = (UI.pick === t.dataset.pick) ? null : t.dataset.pick;
    render();
    return;
  }

  if(t.dataset.unschedule){
    st(t.dataset.unschedule).scheduledFor = null;
    render();
    save();
    return;
  }

  // Every waiting post that has no day yet, one per free day, starting tomorrow.
  if(t.id === "calfill"){
    var taken = {};
    D.posts.forEach(function(p){ var d = scheduleDay(p); if(d) taken[d] = 1; });
    var day = addDays(today(), 1);
    unscheduled().forEach(function(p){
      while(taken[day]) day = addDays(day, 1);
      st(p.id).scheduledFor = day;
      taken[day] = 1;
      day = addDays(day, 1);
    });
    render();
    save();
    return;
  }

  // Only future days. A posted day is a fact, not a plan.
  if(t.id === "calclear"){
    var n = 0;
    D.posts.forEach(function(p){
      var s = st(p.id);
      if(s.scheduledFor && s.scheduledFor >= today() && s.status !== "posted"){ s.scheduledFor = null; n++; }
    });
    render();
    if(n) save();
    return;
  }

  if(t.id === "lang"){ UI.both = !UI.both; UI.focusFind = false; keepUI(); render(); return; }

  if(t.id === "extras"){ UI.extras = !UI.extras; UI.focusFind = false; keepUI(); render(); return; }
  if(t.dataset.extras){ UI.extras = true; UI.focusFind = false; keepUI(); render(); return; }

  if(t.dataset.toggle){
    var id = t.dataset.toggle;
    UI.open[id] = !UI.open[id];
    UI.focusFind = false;
    keepUI();
    render();
    if(UI.open[id]){
      var el = document.getElementById("c" + id);
      if(el) el.scrollIntoView({block:"start", behavior:"smooth"});
    }
    return;
  }

  if(t.dataset.copy){
    var src = document.getElementById("src-" + t.dataset.copy);
    if(src) copy(src.textContent, t);
    return;
  }
  if(t.classList.contains("opt")){ copy(t.dataset.copytext, t); return; }

  if(t.dataset.ver){
    var a = t.dataset.ver.split("|");
    st(a[0]).version = a[1];
    UI.focusFind = false;
    render();
    save();
    return;
  }

  if(t.dataset.status){
    var b = t.dataset.status.split("|");
    var s = st(b[0]);
    s.status = b[1];
    s.postedAt = (b[1] === "posted") ? (s.postedAt || today()) : null;
    UI.focusFind = false;
    render();
    save();
    return;
  }

  if(t.dataset.clearnote){
    st(t.dataset.clearnote).notes = "";
    UI.focusFind = false;
    render();
    save();
    return;
  }

  if(t.id === "ideaadd"){
    var box = document.getElementById("ideabox");
    var txt = box ? box.value.trim() : "";
    if(!txt){ if(box) box.focus(); return; }
    D.ideas.push({id:"i" + Date.now(), text:txt, ts:today()});
    if(box) box.value = "";
    UI.focusFind = false;
    render();
    save();
    return;
  }

  if(t.dataset.idea){
    var gone = t.dataset.idea;
    D.ideas = D.ideas.filter(function(x){ return x.id !== gone; });
    UI.focusFind = false;
    render();
    save();
    return;
  }
});

// Tap a day: place the picked post, or pick up the one already there.
document.addEventListener("click", function(e){
  if(UI.view !== "calendar") return;
  var cell = e.target.closest ? e.target.closest(".day") : null;
  if(!cell) return;
  if(e.target.closest("button")) return;
  var day = cell.dataset.day;
  if(UI.pick){
    var sitting = postOnDay(day);
    if(sitting && st(sitting.id).status === "posted") return;
    if(sitting) st(sitting.id).scheduledFor = null;
    st(UI.pick).scheduledFor = day;
    UI.pick = null;
    render();
    save();
    return;
  }
  var p = postOnDay(day);
  if(p && st(p.id).status !== "posted"){ UI.pick = p.id; render(); }
});

/* ---------- drag a post onto a day (laptop only, tapping covers phones) ---------- */
document.addEventListener("dragstart", function(e){
  var chip = e.target.closest ? e.target.closest("[data-pick]") : null;
  if(!chip) return;
  UI.pick = chip.dataset.pick;
  try{ e.dataTransfer.setData("text/plain", chip.dataset.pick); e.dataTransfer.effectAllowed = "move"; }catch(x){}
});
document.addEventListener("dragover", function(e){
  if(UI.view !== "calendar" || !UI.pick) return;
  var cell = e.target.closest ? e.target.closest(".day") : null;
  if(!cell) return;
  e.preventDefault();
  cell.classList.add("over");
});
document.addEventListener("dragleave", function(e){
  var cell = e.target.closest ? e.target.closest(".day") : null;
  if(cell) cell.classList.remove("over");
});
document.addEventListener("drop", function(e){
  if(UI.view !== "calendar") return;
  var cell = e.target.closest ? e.target.closest(".day") : null;
  if(!cell || !UI.pick) return;
  e.preventDefault();
  var day = cell.dataset.day, sitting = postOnDay(day);
  if(sitting && st(sitting.id).status === "posted"){ UI.pick = null; render(); return; }
  if(sitting) st(sitting.id).scheduledFor = null;
  st(UI.pick).scheduledFor = day;
  UI.pick = null;
  render();
  save();
});

document.addEventListener("input", function(e){
  if(e.target.id === "find"){
    UI.q = e.target.value;
    UI.focusFind = true;
    keepUI();
    clearTimeout(render.ft);
    render.ft = setTimeout(render, 220);
  }
});

document.addEventListener("change", function(e){
  var d = e.target.dataset;
  if(d && d.note){
    var val = e.target.value;
    if(st(d.note).notes !== val){
      st(d.note).notes = val;
      save();
    }
  }
});

function start(){
  render();
  if(typeof STORE.boot !== "function") return;
  STORE.boot().then(function(res){
    if(!res) return;
    if(res.gate && typeof STORE.renderGate === "function"){
      STORE.renderGate(document.getElementById("root"));
      return;
    }
    mergeRemote(res.data);
    render();
  }, function(err){
    pill("Could not load \u2014 " + ((err && (err.message || err.code)) || "unknown error"), true);
  });
}

start();

})();
</script>
