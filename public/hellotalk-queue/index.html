<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HelloTalk Post Queue</title>
<!-- Public URL, private content. Keep it out of search results. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%AE%3C/text%3E%3C/svg%3E">
<link id="app-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600&display=swap">
<style id="app-css">/* One committed look: black ground, electric blue, soft glow.
   Every colour is painted explicitly so the page holds on any host theme. */
:root{
  color-scheme:dark;
  --bg:#04060e; --surface:#0a1020; --surface-2:#0f1730; --sunk:#070c18;
  --ink:#e9f0ff; --ink-2:#adc0e4; --muted:#8296c0;
  --line:#1a2544; --line-2:#2b3b66;
  --blue:#3d7dff; --blue-2:#6fa8ff; --blue-soft:#101f3f; --blue-ink:#9cc4ff;
  --cyan:#2fd9ff; --cyan-soft:#082630; --cyan-ink:#8ae8ff;
  --violet:#9d7bff; --violet-soft:#1a1436; --violet-ink:#c3aeff;
  --slate:#7188ad; --slate-soft:#131a2c;
  --btn-ink:#04121f;
  --glow-blue:0 0 0 1px rgba(61,125,255,.45), 0 0 20px rgba(61,125,255,.30);
  --glow-cyan:0 0 0 1px rgba(47,217,255,.45), 0 0 20px rgba(47,217,255,.26);
  --glow-violet:0 0 0 1px rgba(157,123,255,.45), 0 0 20px rgba(157,123,255,.24);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 10px 26px -18px rgba(0,0,0,.9);
  --lift:0 0 0 1px rgba(61,125,255,.55), 0 18px 44px -12px rgba(61,125,255,.35);
  --sans:"Noto Sans SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --serif:"Noto Serif SC",Georgia,"Songti SC",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;background:radial-gradient(1100px 640px at 12% -12%, rgba(61,125,255,.20), transparent 62%),radial-gradient(820px 520px at 92% 6%, rgba(157,123,255,.15), transparent 60%),radial-gradient(700px 700px at 50% 115%, rgba(47,217,255,.10), transparent 62%),var(--bg);background-attachment:fixed;background-repeat:no-repeat}
body.is-dragging{cursor:grabbing;-webkit-user-select:none;user-select:none}
#root{max-width:60rem;margin:0 auto;padding:0 14px 96px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}

/* ---------- header ---------- */
.head{padding:26px 2px 14px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--cyan-ink);margin:0 0 6px;text-shadow:0 0 12px rgba(47,217,255,.4)}
.head h1{font-family:var(--serif);font-weight:600;font-size:27px;line-height:1.2;margin:0;text-wrap:balance;color:var(--ink);background:linear-gradient(102deg,#ffffff,#9cc4ff 46%,#2fd9ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 14px rgba(61,125,255,.45))}
.tally{display:flex;gap:14px;align-items:baseline;margin:12px 0 8px;flex-wrap:wrap}
.tally b{font-family:var(--mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.tally span{font-size:12.5px;color:var(--muted)}
.tally .unit{display:flex;gap:5px;align-items:baseline}
.rail{height:5px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex;box-shadow:0 0 0 1px var(--line) inset}
.rail i{display:block;height:100%}
.rail .done{background:linear-gradient(90deg,var(--blue),var(--cyan));box-shadow:0 0 14px rgba(47,217,255,.6)}
.rail .oldbar{background:var(--violet);box-shadow:0 0 12px rgba(157,123,255,.5)}
.rail .skip{background:var(--slate)}

/* ---------- toolbar ---------- */
.tools{position:sticky;top:0;z-index:20;background:rgba(4,6,14,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:10px 0 8px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line-2);background:var(--sunk);border-radius:99px;padding:6px 10px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--blue),var(--cyan));border-color:transparent;color:var(--btn-ink);font-weight:600;box-shadow:var(--glow-blue)}
.chip b{font-family:var(--mono);font-weight:500;opacity:.75;margin-left:5px}
.row2{display:flex;gap:6px;margin-top:8px}
.find{flex:1;min-width:0;background:var(--sunk);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;font-size:15px;color:var(--ink)}
.find::placeholder{color:var(--muted)}
.lang{flex:0 0 auto;background:var(--sunk);border:1px solid var(--line-2);border-radius:10px;padding:0 12px;font-size:13px;color:var(--ink-2);min-height:42px;white-space:nowrap}
.lang[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-ink);font-weight:500;box-shadow:var(--glow-blue)}
/* The extras switch is a single glyph so three controls still fit a phone row. */
#extras{min-width:42px;padding:0 10px;font-size:16px;line-height:1}
#extras[aria-pressed="true"]{background:var(--cyan-soft);border-color:var(--cyan);color:var(--cyan-ink);box-shadow:var(--glow-cyan)}

/* ---------- card ---------- */
.card{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,0) 120px),var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:10px;box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:112px}
.card.is-open{border-color:var(--blue);box-shadow:var(--glow-blue),var(--shadow)}
.card.is-posted,.card.is-old,.card.is-skipped{background:var(--surface-2)}
.card.is-skipped{opacity:.72}
.card.dragging{box-shadow:var(--lift);border-color:var(--cyan);opacity:.97;position:relative;z-index:30}
.card.dragging .body,.card.dragging .marks{display:none}

.row{display:flex;align-items:stretch}
.grip{flex:0 0 auto;width:38px;border:0;border-right:1px solid var(--line);background:var(--sunk);color:var(--muted);font-size:15px;line-height:1;touch-action:none;cursor:grab;display:flex;align-items:center;justify-content:center}
.grip:active{cursor:grabbing;color:var(--cyan);text-shadow:0 0 12px rgba(47,217,255,.8)}
.grip[data-off="1"]{color:var(--line-2);cursor:default}
.bar{flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:start;background:none;border:0;text-align:left;padding:13px 13px}
.num{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.t{min-width:0}
.t h2{font-family:var(--serif);font-weight:600;font-size:16.5px;line-height:1.35;margin:0;text-wrap:balance}
.card.is-posted .t h2,.card.is-skipped .t h2,.card.is-old .t h2{color:var(--ink-2)}
.peek{display:block;max-width:100%;margin:5px 0 0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:7px}
.flags:empty{display:none}
.stamp{font-family:var(--serif);font-size:11px;color:var(--cyan);border:1.4px solid var(--cyan);border-radius:3px;padding:0 5px;line-height:1.6;transform:rotate(-3.5deg);display:inline-block;box-shadow:0 0 14px rgba(47,217,255,.35);text-shadow:0 0 10px rgba(47,217,255,.6)}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:99px;border:1px solid var(--line-2);color:var(--muted)}
.tag.next{border-color:var(--cyan);color:var(--cyan-ink);background:var(--cyan-soft);box-shadow:var(--glow-cyan)}
.tag.note{border-color:var(--violet);color:var(--violet-ink);background:var(--violet-soft)}
.tag.oldtag{border-color:var(--violet);color:var(--violet-ink);background:var(--violet-soft)}
.tag.skip{text-decoration:line-through}
.caret{color:var(--ink-2);font-size:14px;padding-top:2px;transition:transform .18s}
.card.is-open .caret{transform:rotate(180deg)}
@media (prefers-reduced-motion:reduce){.caret{transition:none}}

/* ---------- status buttons, always visible ---------- */
.marks{display:flex;gap:6px;padding:0 11px 11px 11px;flex-wrap:wrap;max-width:34rem}
.marks button{flex:1 1 0;min-width:72px;min-height:38px;border:1px solid var(--line);background:var(--sunk);border-radius:9px;font-size:13px;color:var(--muted)}
.marks button[aria-pressed="true"]{font-weight:600}
.marks button.mt[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-ink);box-shadow:var(--glow-blue)}
.marks button.mp[aria-pressed="true"]{background:var(--cyan-soft);border-color:var(--cyan);color:var(--cyan-ink);box-shadow:var(--glow-cyan)}
.marks button.ms[aria-pressed="true"]{background:var(--slate-soft);border-color:var(--slate);color:var(--ink-2)}
.marks button.mo[aria-pressed="true"]{background:var(--violet-soft);border-color:var(--violet);color:var(--violet-ink);box-shadow:var(--glow-violet)}

/* ---------- body ---------- */
.body{padding:0 13px 14px;display:none;flex-direction:column;gap:14px}
.card.is-open .body{display:flex}
.seg{display:flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;align-self:flex-start}
.seg button{background:var(--sunk);border:0;padding:7px 13px;font-size:13px;color:var(--ink-2);border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--blue-soft);color:var(--blue-ink);font-weight:600;box-shadow:0 0 18px rgba(61,125,255,.25) inset}

.block{border:1px solid var(--line);border-radius:11px;background:var(--sunk);overflow:hidden}
.block > header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 11px;border-bottom:1px solid var(--line)}
.block h3{margin:0;font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* Chinese and English side by side once there is room, stacked before that. */
.pair{display:grid;grid-template-columns:1fr;background:var(--surface)}
.side{min-width:0;padding:11px 13px 13px}
.side + .side{border-top:1px solid var(--line);background:var(--sunk)}
@media (min-width:760px){
  .pair.two{grid-template-columns:1fr 1fr}
  .pair.two .side + .side{border-top:0;border-left:1px solid var(--line)}
}
body.zh-only .side.enside{display:none}
.plabel{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--blue-ink);margin-bottom:6px}
.zh{margin:0;white-space:pre-wrap;word-break:break-word;font-size:16px;line-height:1.75}
.zh.small{font-size:15px}
.en{margin:0;white-space:pre-wrap;font-size:14px;line-height:1.7;color:var(--ink-2)}

.copy{flex:0 0 auto;min-height:36px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:var(--btn-ink);border:0;border-radius:8px;padding:0 14px;font-size:13px;font-weight:600;box-shadow:0 0 22px rgba(61,125,255,.4);transition:box-shadow .18s,filter .18s}
.copy:hover{box-shadow:0 0 30px rgba(47,217,255,.6);filter:brightness(1.08)}
.copy.ok{background:linear-gradient(135deg,var(--cyan),#b6f7ff);box-shadow:0 0 34px rgba(47,217,255,.75)}
@media (prefers-reduced-motion:reduce){.copy{transition:none}}
.big{width:100%;min-height:50px;font-size:15px;border-radius:10px}
.opts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:11px 13px;background:var(--surface);border-top:1px solid var(--line)}
.opt{background:var(--sunk);border:1px solid var(--line-2);border-radius:8px;padding:7px 11px;font-size:14px;text-align:left;color:var(--ink)}
.opt.ok{border-color:var(--cyan);color:var(--cyan-ink);background:var(--cyan-soft);box-shadow:var(--glow-cyan)}

.hint{font-size:12.5px;color:var(--muted);margin:0;padding:0 2px}
.label{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:500}
.notes{width:100%;background:var(--sunk);border:1px solid var(--line-2);border-radius:10px;padding:11px;font-size:15px;line-height:1.6;min-height:84px;resize:vertical;color:var(--ink)}
.noterow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:7px}
.ghost{flex:0 0 auto;min-height:36px;background:transparent;border:1px solid var(--line-2);border-radius:8px;padding:0 11px;font-size:12.5px;color:var(--ink-2)}
.meta{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}

/* ---------- ideas ---------- */
.ideas{margin-top:30px;border-top:1px solid var(--line);padding-top:20px}
.ideas h2{font-family:var(--serif);font-size:19px;font-weight:600;margin:0 0 4px;color:var(--blue-ink)}
.idea{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-top:8px}
.idea p{margin:0;flex:1;font-size:14.5px;white-space:pre-wrap}
.idea time{font-family:var(--mono);font-size:10.5px;color:var(--muted);flex:0 0 auto;padding-top:3px}
.x{background:none;border:0;color:var(--muted);font-size:17px;line-height:1;padding:2px 4px;flex:0 0 auto}
.empty{font-size:14px;color:var(--muted);padding:14px 2px}

/* ---------- save pill ---------- */
.pill{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:40;background:rgba(10,16,32,.94);color:var(--ink);border:1px solid var(--blue);box-shadow:var(--glow-blue);border-radius:99px;padding:9px 17px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.pill.on{opacity:1}
.pill.warn{background:rgba(48,12,20,.95);border-color:#ff6b81;color:#ffd7dd;box-shadow:0 0 0 1px rgba(255,107,129,.5),0 0 22px rgba(255,107,129,.35)}
.foot{margin-top:26px;font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.8;text-align:center}

/* ---------- view tabs ---------- */
.views{display:flex;gap:6px;margin:14px 0 12px}
.views .vtab{flex:1;min-height:40px;border:1px solid var(--line-2);border-radius:10px;
  background:var(--surface);color:var(--ink-2);font-size:14px;font-weight:600}
.views .vtab[aria-pressed="true"]{border-color:var(--blue);color:var(--ink);
  background:var(--blue-soft);box-shadow:var(--glow-blue)}

/* ---------- calendar ---------- */
.calbar{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.calbar h2{flex:1;margin:0;font-family:var(--serif);font-size:19px;font-weight:600;text-align:center}
.calnav{min-width:40px;min-height:40px;border:1px solid var(--line-2);border-radius:10px;
  background:var(--surface);color:var(--ink);font-size:18px;line-height:1}
.calnav.today{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:0 10px}

.tray{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px;margin:0 0 12px}
.tray .hint{margin:0 0 9px}
.tray.empty .traylist{display:none}
.traylist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tchip{display:flex;align-items:center;gap:7px;max-width:100%;min-height:38px;padding:0 11px;
  border:1px solid var(--line-2);border-radius:99px;background:var(--sunk);color:var(--ink-2);
  font-size:13px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:grab}
.tchip b{font-family:var(--mono);font-size:11px;color:var(--cyan-ink)}
.tchip.picked{border-color:var(--cyan);color:var(--ink);background:var(--cyan-soft);box-shadow:var(--glow-cyan)}
.calacts{display:flex;gap:7px;flex-wrap:wrap}
.calacts .ghost{background:none;border:1px solid var(--line-2);color:var(--ink-2);box-shadow:none}

.cal{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--sunk);
  border-bottom:1px solid var(--line)}
.dow span{min-width:0;padding:7px 2px;text-align:center;font-family:var(--mono);font-size:10px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
/* min-width:0 everywhere below. Grid and flex children default to min-width:auto,
   so one long English title stretched a column and pushed Sat and Sun off a phone
   screen, silently, because .cal clips with overflow:hidden. */
.day{position:relative;min-width:0;min-height:74px;padding:4px 3px 5px;
  border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;gap:3px;cursor:pointer}
.day:nth-child(7n){border-right:0}
.day.out{opacity:.35}
.day.past{background:var(--sunk)}
.day.now{box-shadow:inset 0 0 0 1.5px var(--cyan)}
.day.over{background:var(--blue-soft)}
.dnum{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.day.now .dnum{color:var(--cyan-ink);font-weight:500}
.dpost{flex:1;min-width:0;min-height:0;position:relative;border-radius:7px;padding:3px 4px;overflow:hidden;
  background:var(--blue-soft);border:1px solid var(--line-2)}
.dpost b{display:block;min-width:0;font-family:var(--mono);font-size:10px;color:var(--blue-ink)}
.dpost span{min-width:0;font-size:10px;line-height:1.3;color:var(--ink-2);overflow-wrap:anywhere;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dpost.done{background:var(--cyan-soft);border-color:var(--cyan)}
.dpost.done b{color:var(--cyan-ink)}
.dpost .tick{display:block;min-width:0;margin-top:2px;font-family:var(--mono);font-size:8.5px;
  letter-spacing:.02em;text-transform:uppercase;color:var(--cyan);font-style:normal;
  overflow:hidden;text-overflow:ellipsis}
.dpost .x{position:absolute;top:1px;right:1px;width:19px;height:19px;border:0;border-radius:5px;
  background:none;color:var(--muted);font-size:14px;line-height:1;padding:0}
.calfoot{margin-top:10px}

@media (max-width:420px){
  .day{min-height:62px}
  .dpost span{-webkit-line-clamp:1}
}
</style>
<style id="gate-css">
/* Sign-in screen. Site build only. The artifact build has no gate. */
.gate{max-width:26rem;margin:0 auto;padding:14vh 0 0}
.gate h1{font-family:var(--serif);font-weight:600;font-size:26px;margin:0 0 6px;
  background:linear-gradient(102deg,#ffffff,#9cc4ff 46%,#2fd9ff);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;filter:drop-shadow(0 0 14px rgba(61,125,255,.45))}
.gate p{color:var(--ink-2);font-size:14.5px;line-height:1.6;margin:0 0 18px}
.gate form{display:flex;flex-direction:column;gap:9px}
.gate input{background:var(--sunk);border:1px solid var(--line-2);border-radius:10px;
  padding:13px 13px;font-size:16px;color:var(--ink);width:100%}
.gate input::placeholder{color:var(--muted)}
.gate button{min-height:48px;border:0;border-radius:10px;font-size:15px;font-weight:600;
  color:var(--btn-ink);background:linear-gradient(135deg,var(--blue),var(--cyan));
  box-shadow:0 0 24px rgba(61,125,255,.45)}
.gate button[disabled]{filter:grayscale(.5) brightness(.8);box-shadow:none}
.gate .msg{margin:14px 0 0;font-size:13.5px;line-height:1.6;color:var(--cyan-ink)}
.gate .msg.bad{color:#ffb3bd}
.gate .alt{margin:14px 0 0;text-align:center}
.gate .alt button{min-height:0;background:none;box-shadow:none;border:0;padding:4px;
  color:var(--ink-2);font-size:13px;font-weight:400;text-decoration:underline;
  text-underline-offset:3px}
.gate .alt button[disabled]{opacity:.5}
.gate .fine{margin-top:20px;font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.8}
</style>
</head>
