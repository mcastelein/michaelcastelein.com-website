<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Who's on the Boat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%9B%B3%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b1523; --bg-2:#101f33; --card:#16283f; --card-2:#1d3350;
  --line:#26405f; --ink:#eaf2fb; --ink-dim:#9db2cc; --ink-faint:#6b83a1;
  --accent:#39d3c3; --accent-ink:#04231f;
  --good:#3ddc97; --bad:#ff6b6b; --warn:#ffc857;
  --radius:16px; --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 700px at 50% -10%, #17304d 0%, var(--bg) 60%) no-repeat, var(--bg);
  min-height:100vh; color:var(--ink);
  font:16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:860px; margin:0 auto; padding:24px 16px 64px}
h1,h2,h3{margin:0; font-weight:700; letter-spacing:-.02em}
h1{font-size:clamp(26px,5vw,38px)}
h2{font-size:clamp(20px,3.6vw,26px)}
p{margin:0}
button{font:inherit; color:inherit; border:0; background:none; cursor:pointer}
.hidden{display:none !important}

/* ---------- top bar ---------- */
.topbar{display:flex; align-items:center; gap:12px; margin-bottom:22px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px; margin-right:auto; min-width:0}
.brand .dot{width:11px; height:11px; border-radius:50%; background:var(--accent); flex:none;
  box-shadow:0 0 0 4px rgba(57,211,195,.16)}
.brand .sub{color:var(--ink-faint); font-size:13px}
.btn{
  padding:10px 16px; border-radius:999px; background:var(--card); border:1px solid var(--line);
  color:var(--ink); font-weight:600; font-size:14px; transition:.15s; white-space:nowrap;
}
.btn:hover{background:var(--card-2); border-color:var(--accent)}
.btn-primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn-primary:hover{filter:brightness(1.08); background:var(--accent)}
.btn-ghost{background:transparent}
.btn-sm{padding:7px 12px; font-size:13px}

/* ---------- home ---------- */
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:20px 0 26px}
.stat{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px}
.stat .n{font-size:26px; font-weight:800; line-height:1.1}
.stat .l{font-size:12px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.08em; margin-top:4px}
.stat.good .n{color:var(--good)} .stat.warn .n{color:var(--warn)} .stat.dim .n{color:var(--ink-dim)}

.bar{height:8px; border-radius:99px; background:var(--card); overflow:hidden; border:1px solid var(--line)}
.bar > i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--good)); transition:width .35s}

.section-label{font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-faint); margin:26px 0 10px}
.modes{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px}
.mode{
  text-align:left; background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px; display:flex; gap:13px; align-items:flex-start; transition:.15s; width:100%;
}
.mode:hover:not(:disabled){border-color:var(--accent); background:var(--card-2); transform:translateY(-2px)}
.mode:disabled{opacity:.4; cursor:not-allowed}
.mode .ico{font-size:22px; line-height:1; flex:none; margin-top:2px}
.mode .t{font-weight:700; margin-bottom:3px; display:block}
.mode .d{font-size:13px; color:var(--ink-dim); display:block}
.mode.feature{background:linear-gradient(135deg,var(--card-2),var(--card)); border-color:var(--accent)}

/* ---------- quiz ---------- */
.qhead{display:flex; align-items:center; gap:12px; margin-bottom:14px}
.qhead .count{font-size:13px; color:var(--ink-faint); white-space:nowrap}
.qcard{
  background:var(--card); border:1px solid var(--line); border-radius:22px; padding:22px;
  box-shadow:var(--shadow); margin-bottom:16px;
}
.prompt{font-size:13px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.09em; margin-bottom:14px}
.subject{display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center}
.face{
  width:190px; height:190px; border-radius:20px; object-fit:cover; background:var(--card-2);
  border:1px solid var(--line); display:block;
}
.face-fallback{
  width:190px; height:190px; border-radius:20px; background:var(--card-2); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:56px; font-weight:800; color:var(--ink-faint);
}
.subject .big{font-size:clamp(22px,4.4vw,30px); font-weight:800; letter-spacing:-.02em}

.options{display:grid; gap:10px; grid-template-columns:1fr}
/* Square photo tiles get tall fast on a wide screen, so the photo grid is
   capped and centred rather than filling the card. */
.options.grid2{grid-template-columns:repeat(2,1fr); max-width:520px; margin:0 auto}
.opt{
  display:flex; align-items:center; gap:12px; text-align:left; width:100%;
  background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 15px;
  transition:.12s; font-size:15px;
}
.opt:hover:not(.locked){border-color:var(--accent); background:var(--card-2)}
.opt .key{
  flex:none; width:24px; height:24px; border-radius:7px; background:var(--card-2); border:1px solid var(--line);
  font-size:12px; font-weight:700; color:var(--ink-faint); display:flex; align-items:center; justify-content:center;
}
.opt.correct{border-color:var(--good); background:rgba(61,220,151,.12)}
.opt.wrong{border-color:var(--bad); background:rgba(255,107,107,.12)}
.opt.locked{cursor:default}
.opt-photo{flex-direction:column; align-items:stretch; padding:8px; gap:8px}
/* Square, because the source photos are square crops centred on the face.
   A short wide tile would make the browser crop them again and take the top
   of the head off. */
.opt-photo .face,.opt-photo .face-fallback{width:100%; height:auto; aspect-ratio:1/1;
  border-radius:10px; object-fit:cover; font-size:38px}
/* min-height holds the row open while the name is still hidden, so the
   grid does not jump when the answer is revealed. */
.opt-photo .lbl{display:flex; align-items:center; gap:8px; font-size:13px;
  color:var(--ink-dim); min-height:24px}

.typewrap{display:flex; gap:10px; flex-wrap:wrap}
.typewrap input{
  flex:1 1 220px; min-width:0; padding:13px 15px; border-radius:14px; background:var(--card-2);
  border:1px solid var(--line); color:var(--ink); font:inherit;
}
.typewrap input:focus{outline:none; border-color:var(--accent)}

.feedback{margin-top:16px; border-radius:16px; padding:15px 17px; border:1px solid var(--line); background:var(--card)}
.feedback.ok{border-color:var(--good)} .feedback.no{border-color:var(--bad)}
.feedback .verdict{font-weight:800; margin-bottom:8px}
.feedback.ok .verdict{color:var(--good)} .feedback.no .verdict{color:var(--bad)}
.facts{display:flex; flex-direction:column; gap:5px; font-size:14px; color:var(--ink-dim)}
.facts b{color:var(--ink); font-weight:600}
.feedback .actions{margin-top:14px; display:flex; gap:10px; flex-wrap:wrap}

/* ---------- results ---------- */
.score{font-size:54px; font-weight:800; letter-spacing:-.03em; line-height:1}
.missed{display:flex; flex-direction:column; gap:10px; margin-top:14px}
.missed .row{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
  border-radius:14px; padding:10px 13px}
.missed .face,.missed .face-fallback{width:46px; height:46px; border-radius:10px; font-size:17px; flex:none}
.missed .nm{font-weight:600} .missed .rl{font-size:13px; color:var(--ink-faint)}

/* ---------- browse ---------- */
.tools{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center}
.tools input{
  flex:1 1 200px; min-width:0; padding:11px 15px; border-radius:999px; background:var(--card);
  border:1px solid var(--line); color:var(--ink); font:inherit;
}
.tools input:focus{outline:none; border-color:var(--accent)}
.chip{padding:9px 15px; border-radius:999px; background:var(--card); border:1px solid var(--line); font-size:14px}
.chip.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600}
.people{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px}
.pcard{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; display:flex; gap:12px}
.pcard .face,.pcard .face-fallback{width:64px; height:64px; border-radius:12px; font-size:22px; flex:none}
.pcard .body{min-width:0}
.pcard .nm{font-weight:700; letter-spacing:-.01em}
.pcard .rl{font-size:13px; color:var(--accent); margin-top:2px}
.pcard .ds{font-size:13px; color:var(--ink-dim); margin-top:6px}
.pcard .mast{font-size:11px; color:var(--ink-faint); margin-top:7px; text-transform:uppercase; letter-spacing:.07em}
.pcard a{color:var(--ink-faint); font-size:12px; text-decoration:none; border-bottom:1px solid var(--line)}
.pcard a:hover{color:var(--accent)}
.empty{text-align:center; color:var(--ink-faint); padding:40px 10px}

/* ---------- pin gate ---------- */
.gate{position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
  padding:20px; background:radial-gradient(900px 600px at 50% 0%, #17304d 0%, var(--bg) 70%) no-repeat, var(--bg)}
.gate-card{width:100%; max-width:360px; background:var(--card); border:1px solid var(--line);
  border-radius:22px; padding:28px 24px; box-shadow:var(--shadow); text-align:center}
.gate-card h2{margin-bottom:6px}
.gate-card p{color:var(--ink-dim); font-size:14px; margin-bottom:18px}
.gate-card input{width:100%; padding:14px 16px; border-radius:14px; background:var(--card-2);
  border:1px solid var(--line); color:var(--ink); font:inherit; font-size:22px; text-align:center;
  letter-spacing:.3em; margin-bottom:12px}
.gate-card input:focus{outline:none; border-color:var(--accent)}
.gate-card .btn{width:100%}
.gate-msg{min-height:20px; margin-top:12px; font-size:13px; color:var(--bad)}
.gate-msg.busy{color:var(--ink-faint)}

@media (max-width:560px){
  .stats{grid-template-columns:1fr 1fr}
  .options.grid2{grid-template-columns:1fr 1fr}
  .face,.face-fallback{width:150px; height:150px}
}
</style>
</head>
<body>

<!-- Shown only when the data arrives encrypted, which is the published copy.
     A local copy loads people.js directly and never sees this. -->
<div class="gate hidden" id="gate">
  <div class="gate-card">
    <h2>Who's on the Boat</h2>
    <p>Nomad Cruise 2026. Not a public page. Enter the PIN.</p>
    <input id="pinIn" type="password" inputmode="numeric" autocomplete="off"
           maxlength="16" placeholder="PIN">
    <button class="btn btn-primary" id="pinGo">Unlock</button>
    <div class="gate-msg" id="pinMsg"></div>
  </div>
</div>

<div class="wrap" id="app" hidden>

  <div class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <h1>Who's on the Boat</h1>
        <div class="sub">Nomad Cruise &middot; Southampton to New York 2026</div>
      </div>
    </div>
    <button class="btn btn-sm" id="navBrowse">Browse all</button>
    <button class="btn btn-sm btn-ghost hidden" id="navHome">Quit</button>
  </div>

  <!-- ================= HOME ================= -->
  <section id="home">
    <div class="bar"><i id="masteryBar" style="width:0%"></i></div>
    <div class="stats">
      <div class="stat good"><div class="n" id="sMastered">0</div><div class="l">Known</div></div>
      <div class="stat warn"><div class="n" id="sLearning">0</div><div class="l">Learning</div></div>
      <div class="stat dim"><div class="n" id="sNew">0</div><div class="l">Not seen</div></div>
    </div>

    <div class="section-label">Pick a quiz</div>
    <div class="modes" id="modeList"></div>

    <div id="troubleWrap"></div>

    <div class="section-label">Who to include</div>
    <div class="tools">
      <button class="chip on" data-pool="all">Everyone</button>
      <button class="chip" data-pool="weak">Weak spots</button>
      <button class="chip" data-pool="speaker">Speakers</button>
      <button class="chip" data-pool="attendee">Attendees</button>
      <button class="chip" data-pool="crew">Crew</button>
      <button class="btn btn-sm btn-ghost" id="resetBtn" style="margin-left:auto">Reset progress</button>
    </div>
  </section>

  <!-- ================= QUIZ ================= -->
  <section id="quiz" class="hidden">
    <div class="qhead">
      <div class="bar" style="flex:1"><i id="quizBar" style="width:0%"></i></div>
      <div class="count" id="quizCount">1 / 12</div>
    </div>
    <div class="qcard">
      <div class="prompt" id="qPrompt">Who is this?</div>
      <div id="qSubject" class="subject"></div>
      <div id="qOptions" class="options" style="margin-top:20px"></div>
    </div>
    <div id="qFeedback"></div>
  </section>

  <!-- ================= RESULTS ================= -->
  <section id="results" class="hidden">
    <div class="qcard" style="text-align:center">
      <div class="score" id="rScore">0 / 0</div>
      <p id="rLine" style="color:var(--ink-dim); margin-top:10px"></p>
      <div style="display:flex; gap:10px; justify-content:center; margin-top:20px; flex-wrap:wrap">
        <button class="btn btn-primary" id="rAgain">Another round</button>
        <button class="btn" id="rHome">Back to menu</button>
      </div>
    </div>
    <div id="rMissedWrap"></div>
  </section>

  <!-- ================= BROWSE ================= -->
  <section id="browse" class="hidden">
    <div class="tools">
      <input id="bSearch" type="search" placeholder="Search name, role, company, talk">
      <button class="chip on" data-bfilter="all">All</button>
      <button class="chip" data-bfilter="speaker">Speakers</button>
      <button class="chip" data-bfilter="attendee">Attendees</button>
      <button class="chip" data-bfilter="crew">Crew</button>
      <button class="chip" data-bfilter="photo">Has photo</button>
    </div>
    <div id="bList" class="people"></div>
  </section>

</div>

<script>
"use strict";

/* ============================================================
   Data guard. people.js may be missing or empty on a fresh copy.
   ============================================================ */
var ALL = (typeof PEOPLE !== "undefined" && Array.isArray(PEOPLE)) ? PEOPLE : [];

/* ============================================================
   Progress. One Leitner-style box per person, kept in localStorage.
   box 0 = never seen, 5 = known cold. A wrong answer drops it to 1,
   which is what makes missed people come round again sooner.
   ============================================================ */
var STORE_KEY = "nc-people-quiz-v1";
var MASTER_BOX = 4;

function loadProgress(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveProgress(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); }
  catch(e){ /* private mode: the quiz still runs, it just forgets */ }
}
var progress = loadProgress();

function box(id){ return (progress[id] && progress[id].box) || 0; }
function record(id, right){
  var p = progress[id];
  if(!p){ p = progress[id] = {box:0, right:0, wrong:0}; }
  if(right){ p.box = Math.min(5, p.box + 1); p.right++; }
  else { p.box = 1; p.wrong++; }
  p.seen = Date.now();
  saveProgress();
}

/* ============================================================
   Helpers
   ============================================================ */
function $(sel){ return document.querySelector(sel); }
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function shuffle(a){
  var r = a.slice(), i, j, t;
  for(i = r.length - 1; i > 0; i--){
    j = Math.floor(Math.random() * (i + 1));
    t = r[i]; r[i] = r[j]; r[j] = t;
  }
  return r;
}
function sample(arr, n){ return shuffle(arr).slice(0, n); }

function initials(name){
  // Skip quoted nicknames and other punctuation, so Andras "Andy" Kobza
  // gives AK rather than A followed by a quote mark.
  var words = name.split(/\s+/)
    .map(function(w){ return w.replace(/^[^\p{L}]+/u, ""); })
    .filter(function(w){ return w.length; });
  if(!words.length){ return "?"; }
  // First and last word, not the first two, so a middle nickname or initial
  // does not push the surname out.
  var pick = words.length === 1 ? [words[0]] : [words[0], words[words.length - 1]];
  return pick.map(function(w){ return w.charAt(0); }).join("").toUpperCase();
}
function faceHTML(p){
  if(p.photo){
    return '<img class="face" src="' + esc(p.photo) + '" alt="' + esc(p.name) +
      '" data-initials="' + esc(initials(p.name)) + '">';
  }
  return '<div class="face-fallback">' + esc(initials(p.name)) + '</div>';
}
// A broken photo swaps itself for an initials tile, so a missing file
// never leaves an empty hole in a card.
document.addEventListener("error", function(e){
  var el = e.target;
  if(el && el.tagName === "IMG" && el.classList.contains("face")){
    var div = document.createElement("div");
    div.className = "face-fallback";
    div.textContent = el.getAttribute("data-initials") || "?";
    el.parentNode.replaceChild(div, el);
  }
}, true);

function describe(p){
  return [p.role, p.company].filter(Boolean).join(" · ");
}

/* ============================================================
   Question types. Each one declares the field it needs, so a type
   switches itself off when the people file cannot support it.
   ============================================================ */
var TYPES = {
  faceName: {
    icon:"🙂", title:"Photo to name", blurb:"See a face, pick the name.",
    needs: function(p){ return !!p.photo; },
    prompt:"Who is this?",
    subject: function(p){ return faceHTML(p); },
    label: function(p){ return p.name; },
    layout:"list"
  },
  nameFace: {
    icon:"🖼️", title:"Name to photo", blurb:"See a name, pick the face.",
    needs: function(p){ return !!p.photo; },
    prompt:"Which one is this person?",
    subject: function(p){
      return '<div class="big">' + esc(p.name) + '</div>' +
        (describe(p) ? '<div style="color:var(--ink-faint);font-size:14px">' + esc(describe(p)) + '</div>' : "");
    },
    label: function(p){ return p.name; },
    layout:"photos"
  },
  nameRole: {
    icon:"💼", title:"Name to job", blurb:"See a name, pick what they do.",
    needs: function(p){ return !!describe(p); },
    prompt:"What do they do?",
    subject: function(p){ return faceHTML(p) + '<div class="big">' + esc(p.name) + '</div>'; },
    label: function(p){ return describe(p); },
    layout:"list"
  },
  nameTalk: {
    icon:"🎤", title:"Name to talk", blurb:"See a name, pick their session.",
    needs: function(p){ return !!p.does; },
    prompt:"Which talk is theirs?",
    subject: function(p){ return faceHTML(p) + '<div class="big">' + esc(p.name) + '</div>'; },
    label: function(p){ return p.does; },
    layout:"list"
  },
  nameFrom: {
    icon:"🌍", title:"Name to home", blurb:"See a name, pick where they are from.",
    needs: function(p){ return !!p.from; },
    prompt:"Where are they from?",
    subject: function(p){ return faceHTML(p) + '<div class="big">' + esc(p.name) + '</div>'; },
    label: function(p){ return p.from; },
    layout:"list"
  },
  typeName: {
    icon:"⌨️", title:"Hard mode", blurb:"See a face, type the name yourself.",
    needs: function(p){ return !!p.photo; },
    prompt:"Type their name",
    subject: function(p){ return faceHTML(p); },
    label: function(p){ return p.name; },
    layout:"type"
  }
};
var TYPE_KEYS = Object.keys(TYPES);

/* ============================================================
   Pool and round state
   ============================================================ */
var ROUND_LEN = 12;
var poolFilter = "all";
var state = null;

function pool(){
  if(poolFilter === "all"){ return ALL; }
  // "weak" is not a tag. With 108 people the unseen bonus means early rounds
  // are mostly introductions, so this is the way to skip that and drill only
  // the people already got wrong at least once.
  if(poolFilter === "weak"){
    return ALL.filter(function(p){
      var c = progress[p.id];
      return c && c.wrong > 0;
    });
  }
  return ALL.filter(function(p){ return (p.tags || []).indexOf(poolFilter) !== -1; });
}
// Who the question can be ABOUT: the current group only.
function eligible(typeKey){ return pool().filter(TYPES[typeKey].needs); }

// Who the wrong answers can be drawn from: everyone. Keeping these separate
// is what lets a small group, such as Weak spots or Crew, still offer four
// choices. The decoys just have to be plausible, not in the same group.
function eligibleAll(typeKey){ return ALL.filter(TYPES[typeKey].needs); }

function typeUsable(typeKey){
  if(!eligible(typeKey).length){ return false; }
  // Multiple choice needs the answer plus three decoys.
  return typeKey === "typeName" ? true : eligibleAll(typeKey).length >= 4;
}

/* ---------- how often a person comes up ----------
   Same two rules as the bopomofo trainer, and nothing else gets a vote, so
   neither can be overridden by the other:
     1. lower percent right  ->  comes up more
     2. fewer times seen     ->  comes up more
   The spread is deliberately wide. Someone you always miss is worth about
   eleven times someone you always get, which is what makes the hard ones
   come back over and over instead of the deck feeling flat. */
var NOVELTY = 6;       // how hard the "I have barely seen this one" pull is
var UNSEEN_W = 14;     // a person never met yet jumps the queue

function weight(p){
  var c = progress[p.id];
  var n = c ? c.right + c.wrong : 0;
  if(n === 0){ return UNSEEN_W; }
  var miss = 1 - c.right / n;               // 0 when perfect, 1 when always wrong
  var byScore = 0.35 + 3.65 * miss;         // 0.35 at 100% right, 4.0 at 0% right
  var byExposure = 1 + NOVELTY / (n + 1);   // 4.0 after 1 try, 1.86 after 6
  return byScore * byExposure;
}

// Weighted random over the eligible people, never the same person twice in a
// row. Picking live rather than pre-building a round is the other half of it:
// miss someone on question 2 and their weight is already higher by question 3.
function pickWeighted(list, excludeId){
  var candidates = list.filter(function(p){ return p.id !== excludeId; });
  if(!candidates.length){ candidates = list; }
  var total = 0;
  var ws = candidates.map(function(p){ var w = weight(p); total += w; return w; });
  var r = Math.random() * total;
  for(var i = 0; i < candidates.length; i++){
    r -= ws[i];
    if(r <= 0){ return candidates[i]; }
  }
  return candidates[candidates.length - 1];
}

// One question, built on demand against the scores as they stand right now.
function makeQuestion(modeKey, excludeId){
  var keys = modeKey === "mix" ? TYPE_KEYS.filter(typeUsable) : [modeKey];
  if(!keys.length || (modeKey !== "mix" && !typeUsable(modeKey))){ return null; }

  var base = modeKey === "mix" ? pool() : eligible(keys[0]);
  if(modeKey === "mix"){
    base = base.filter(function(p){
      return keys.some(function(k){ return TYPES[k].needs(p); });
    });
  }
  if(!base.length){ return null; }

  var person = pickWeighted(base, excludeId);
  var valid = keys.filter(function(k){ return TYPES[k].needs(person) && typeUsable(k); });
  if(!valid.length){ return null; }

  var k = valid[Math.floor(Math.random() * valid.length)];
  var t = TYPES[k];
  var options = null;

  if(t.layout !== "type"){
    var answer = t.label(person);
    var decoys = sample(eligibleAll(k).filter(function(o){
      return o.id !== person.id && t.label(o) && t.label(o) !== answer;
    }), 3);
    if(decoys.length < 3){ return null; }
    options = shuffle([person].concat(decoys));
  }
  return {type:k, person:person, options:options};
}

// Who keeps catching you out. Needs a couple of attempts before it will
// accuse anyone, so one unlucky guess does not put someone top of the list.
function troublemakers(limit){
  return pool().filter(function(p){
    var c = progress[p.id];
    return c && c.right + c.wrong >= 2 && c.wrong > 0;
  }).map(function(p){
    var c = progress[p.id];
    var n = c.right + c.wrong;
    return {person:p, miss: c.wrong / n, wrong: c.wrong, n: n};
  }).sort(function(a, b){
    return (b.miss - a.miss) || (b.wrong - a.wrong);
  }).slice(0, limit || 8);
}

/* ============================================================
   Screens
   ============================================================ */
function show(id){
  ["home", "quiz", "results", "browse"].forEach(function(s){
    $("#" + s).classList.toggle("hidden", s !== id);
  });
  $("#navHome").classList.toggle("hidden", id === "home");
  $("#navBrowse").classList.toggle("hidden", id === "browse");
  window.scrollTo(0, 0);
}

function renderHome(){
  var list = pool();
  var mastered = 0, learning = 0, fresh = 0;
  list.forEach(function(p){
    var b = box(p.id);
    if(b >= MASTER_BOX){ mastered++; } else if(b > 0){ learning++; } else { fresh++; }
  });
  $("#sMastered").textContent = mastered;
  $("#sLearning").textContent = learning;
  $("#sNew").textContent = fresh;
  $("#masteryBar").style.width = (list.length ? (mastered / list.length * 100) : 0) + "%";

  var cards = ['<button class="mode feature" data-mode="mix"><span class="ico">🎲</span>' +
    '<span><span class="t">Mixed round</span><span class="d">All question types, up to ' +
    ROUND_LEN + ' questions.</span></span></button>'];

  TYPE_KEYS.forEach(function(k){
    var t = TYPES[k], ok = typeUsable(k);
    cards.push('<button class="mode" data-mode="' + k + '"' + (ok ? "" : " disabled") + '>' +
      '<span class="ico">' + t.icon + '</span><span><span class="t">' + esc(t.title) + '</span>' +
      '<span class="d">' + (ok ? esc(t.blurb) : "Needs more data in people.js") +
      '</span></span></button>');
  });
  if(!list.length){
    $("#modeList").innerHTML = poolFilter === "weak"
      ? '<div class="empty">No weak spots yet. Play a round on Everyone first, ' +
        'then the people you miss collect here.</div>'
      : '<div class="empty">Nobody in this group.</div>';
  } else {
    $("#modeList").innerHTML = cards.join("");
  }

  var hard = troublemakers(6);
  if(hard.length){
    var rows = hard.map(function(x){
      var pct = Math.round((1 - x.miss) * 100);
      return '<div class="row">' + faceHTML(x.person) +
        '<div><div class="nm">' + esc(x.person.name) + '</div>' +
        '<div class="rl">' + pct + '% right, ' + x.wrong + ' of ' + x.n +
        ' missed</div></div></div>';
    }).join("");
    $("#troubleWrap").innerHTML =
      '<div class="section-label">Keeps catching you out</div>' +
      '<p style="color:var(--ink-faint);font-size:13px;margin:-4px 0 10px">' +
      'These already come up far more often. Pick <b>Weak spots</b> below to ' +
      'drill only them.</p>' +
      '<div class="missed">' + rows + '</div>';
  } else {
    $("#troubleWrap").innerHTML = "";
  }
}

/* ---------- quiz ---------- */
function renderQuestion(){
  var q = state.q;
  var t = TYPES[q.type];

  $("#qPrompt").textContent = t.prompt;
  $("#qSubject").innerHTML = t.subject(q.person);
  $("#quizCount").textContent = (state.i + 1) + " / " + state.length +
    (state.streak > 1 ? "  ·  " + state.streak + " in a row" : "");
  $("#quizBar").style.width = (state.i / state.length * 100) + "%";
  $("#qFeedback").innerHTML = "";

  var holder = $("#qOptions");
  holder.className = "options" + (t.layout === "photos" ? " grid2" : "");

  if(t.layout === "type"){
    holder.innerHTML =
      '<div class="typewrap"><input id="typeIn" autocomplete="off" autocapitalize="words" ' +
      'spellcheck="false" placeholder="First and last name">' +
      '<button class="btn btn-primary" id="typeGo">Check</button></div>';
    $("#typeGo").addEventListener("click", submitTyped);
    var input = $("#typeIn");
    input.addEventListener("keydown", function(e){ if(e.key === "Enter"){ submitTyped(); } });
    input.focus();
    return;
  }

  holder.innerHTML = q.options.map(function(o, idx){
    if(t.layout === "photos"){
      // The name stays hidden until the answer is in, or the question
      // would answer itself.
      return '<button class="opt opt-photo" data-idx="' + idx + '">' + faceHTML(o) +
        '<span class="lbl"><span class="key">' + (idx + 1) + '</span>' +
        '<span class="reveal" data-name="' + esc(o.name) + '"></span></span></button>';
    }
    return '<button class="opt" data-idx="' + idx + '"><span class="key">' + (idx + 1) + '</span>' +
      '<span>' + esc(t.label(o)) + '</span></button>';
  }).join("");

  Array.prototype.forEach.call(holder.querySelectorAll(".opt"), function(b){
    b.addEventListener("click", function(){ answer(Number(b.dataset.idx)); });
  });
}

function normalise(s){
  return String(s).normalize("NFKD").replace(/[̀-ͯ]/g, "")
    .toLowerCase().replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
}

function submitTyped(){
  var input = $("#typeIn");
  if(!input || input.disabled){ return; }
  var q = state.q;
  var given = normalise(input.value);
  if(!given){ return; }
  var want = normalise(q.person.name);
  var parts = want.split(" ");
  // Full name counts, and so does the surname on its own. Nothing less.
  var right = given === want || (parts.length > 1 && given === parts[parts.length - 1]);
  input.disabled = true;
  $("#typeGo").disabled = true;
  finish(right, q);
}

function answer(idx){
  var q = state.q;
  var t = TYPES[q.type];
  var right = t.label(q.options[idx]) === t.label(q.person);

  Array.prototype.forEach.call(document.querySelectorAll("#qOptions .opt"), function(b){
    b.classList.add("locked");
    var o = q.options[Number(b.dataset.idx)];
    if(t.label(o) === t.label(q.person)){ b.classList.add("correct"); }
    else if(Number(b.dataset.idx) === idx){ b.classList.add("wrong"); }
    var hidden = b.querySelector(".reveal");
    if(hidden){ hidden.textContent = hidden.getAttribute("data-name"); }
  });
  finish(right, q);
}

function finish(right, q){
  record(q.person.id, right);
  if(right){
    state.score++;
    state.streak++;
    if(state.streak > state.bestStreak){ state.bestStreak = state.streak; }
  } else {
    state.missed.push(q.person);
    state.streak = 0;
  }

  var p = q.person, rows = [];
  if(describe(p)){ rows.push('<div><b>Does:</b> ' + esc(describe(p)) + '</div>'); }
  if(p.does){ rows.push('<div><b>Talk:</b> ' + esc(p.does) + '</div>'); }
  if(p.from){ rows.push('<div><b>From:</b> ' + esc(p.from) + '</div>'); }
  if(p.hook){ rows.push('<div><b>Note:</b> ' + esc(p.hook) + '</div>'); }

  // A miss drops them to box 1 and roughly triples their weight, so say so.
  var c = progress[p.id];
  if(!right && c && c.right + c.wrong > 1){
    rows.push('<div><b>Record:</b> ' + c.right + ' right, ' + c.wrong +
      ' wrong. Coming back soon.</div>');
  }

  var last = state.i === state.length - 1;
  $("#qFeedback").innerHTML =
    '<div class="feedback ' + (right ? "ok" : "no") + '">' +
      '<div class="verdict">' + (right ? "Correct" : "Not quite. It is " + esc(p.name)) + '</div>' +
      '<div class="facts">' + rows.join("") + '</div>' +
      '<div class="actions"><button class="btn btn-primary" id="nextBtn">' +
        (last ? "See results" : "Next") + '</button></div>' +
    '</div>';

  var nb = $("#nextBtn");
  nb.addEventListener("click", next);
  nb.focus();
}

function next(){
  state.i++;
  if(state.i >= state.length){ return renderResults(); }
  nextQuestion();
}

// Drawn fresh each time, so a miss on the previous question already counts.
function nextQuestion(){
  var q = makeQuestion(state.mode, state.lastId);
  if(!q){ return renderResults(); }
  state.q = q;
  state.lastId = q.person.id;
  renderQuestion();
}

function startRound(modeKey){
  if(!makeQuestion(modeKey, null)){
    alert("Not enough people in this pool for that quiz. Pick Everyone, or add more data to people.js.");
    return;
  }
  state = {mode:modeKey, length:ROUND_LEN, i:0, score:0, missed:[],
           q:null, lastId:null, streak:0, bestStreak:0};
  show("quiz");
  nextQuestion();
}

function renderResults(){
  $("#quizBar").style.width = "100%";
  var n = state.length;
  $("#rScore").textContent = state.score + " / " + n;
  var pct = Math.round(state.score / n * 100);
  $("#rLine").textContent =
    (pct === 100 ? "Perfect round. You know these people." :
     pct >= 75 ? "Solid. A few more rounds and you are there." :
     pct >= 40 ? "Getting there. The ones you missed come back sooner." :
                 "Early days. Try Browse all first, then quiz again.") +
    (state.bestStreak > 2 ? " Best run: " + state.bestStreak + " in a row." : "");

  var seen = {}, unique = state.missed.filter(function(p){
    if(seen[p.id]){ return false; }
    seen[p.id] = true;
    return true;
  });

  if(unique.length){
    var rows = unique.map(function(p){
      return '<div class="row">' + faceHTML(p) +
        '<div><div class="nm">' + esc(p.name) + '</div>' +
        '<div class="rl">' + esc(describe(p) || p.does || "") + '</div></div></div>';
    }).join("");
    $("#rMissedWrap").innerHTML =
      '<div class="section-label">Worth another look</div><div class="missed">' + rows + '</div>';
  } else {
    $("#rMissedWrap").innerHTML = "";
  }
  show("results");
  renderHome();
}

/* ---------- browse ---------- */
var browseFilter = "all";

function renderBrowse(){
  var q = normalise($("#bSearch").value || "");
  var list = ALL.filter(function(p){
    // "photo" is not a tag, it asks for the people a photo quiz can use.
    if(browseFilter === "photo"){
      if(!p.photo){ return false; }
    } else if(browseFilter !== "all" && (p.tags || []).indexOf(browseFilter) === -1){
      return false;
    }
    if(!q){ return true; }
    return normalise([p.name, p.role, p.company, p.does, p.from, p.hook].join(" ")).indexOf(q) !== -1;
  });

  if(!list.length){
    $("#bList").innerHTML = '<div class="empty">Nobody matches that.</div>';
    return;
  }
  $("#bList").innerHTML = list.map(function(p){
    var b = box(p.id);
    var c = progress[p.id];
    var n = c ? c.right + c.wrong : 0;
    var mast = b >= MASTER_BOX ? "Known" : b > 0 ? "Learning" : "Not seen yet";
    if(n){ mast += " · " + c.right + " right, " + c.wrong + " wrong"; }
    var links = Object.keys(p.links || {}).map(function(k){
      return '<a href="' + esc(p.links[k]) + '" target="_blank" rel="noopener">' + esc(k) + '</a>';
    }).join(" ");
    return '<div class="pcard">' + faceHTML(p) +
      '<div class="body"><div class="nm">' + esc(p.name) + '</div>' +
      (describe(p) ? '<div class="rl">' + esc(describe(p)) + '</div>' : "") +
      (p.from ? '<div class="ds">' + esc(p.from) + '</div>' : "") +
      (p.does ? '<div class="ds">' + esc(p.does) + '</div>' : "") +
      (p.hook ? '<div class="ds">' + esc(p.hook) + '</div>' : "") +
      (links ? '<div class="ds">' + links + '</div>' : "") +
      '<div class="mast">' + mast + '</div></div></div>';
  }).join("");
}

/* ============================================================
   Wiring
   ============================================================ */
$("#modeList").addEventListener("click", function(e){
  var b = e.target.closest("[data-mode]");
  if(b && !b.disabled){ startRound(b.dataset.mode); }
});

Array.prototype.forEach.call(document.querySelectorAll("[data-pool]"), function(c){
  c.addEventListener("click", function(){
    Array.prototype.forEach.call(document.querySelectorAll("[data-pool]"), function(o){
      o.classList.toggle("on", o === c);
    });
    poolFilter = c.dataset.pool;
    renderHome();
  });
});

Array.prototype.forEach.call(document.querySelectorAll("[data-bfilter]"), function(c){
  c.addEventListener("click", function(){
    Array.prototype.forEach.call(document.querySelectorAll("[data-bfilter]"), function(o){
      o.classList.toggle("on", o === c);
    });
    browseFilter = c.dataset.bfilter;
    renderBrowse();
  });
});

$("#bSearch").addEventListener("input", renderBrowse);
$("#navBrowse").addEventListener("click", function(){ renderBrowse(); show("browse"); });
$("#navHome").addEventListener("click", function(){ renderHome(); show("home"); });
$("#rAgain").addEventListener("click", function(){ startRound(state ? state.mode : "mix"); });
$("#rHome").addEventListener("click", function(){ renderHome(); show("home"); });
$("#resetBtn").addEventListener("click", function(){
  if(!confirm("Wipe all progress and start over?")){ return; }
  progress = {};
  saveProgress();
  renderHome();
});

document.addEventListener("keydown", function(e){
  if($("#quiz").classList.contains("hidden")){ return; }
  if(e.target.tagName === "INPUT"){ return; }
  if(e.key === "Enter"){
    var nb = $("#nextBtn");
    if(nb){ e.preventDefault(); nb.click(); }
    return;
  }
  var n = Number(e.key);
  if(n >= 1 && n <= 4){
    var b = document.querySelector('#qOptions .opt[data-idx="' + (n - 1) + '"]');
    if(b && !b.classList.contains("locked")){ b.click(); }
  }
});

/* ============================================================
   Boot. Two ways in.

   Local copy: people.js sits next to this file and has already run, so ALL
   is populated and the app starts straight away.

   Published copy: there is no people.js. The data ships as data.enc, which
   is AES-GCM ciphertext with the key derived from the PIN. The PIN does not
   merely hide the screen, it is the only way to turn the file into readable
   text, so viewing source or fetching data.enc directly gets nothing. Photo
   files are given random names at build time for the same reason.
   ============================================================ */
var PIN_KEY = "nc-people-quiz-pin";

function b64ToBytes(b64){
  var bin = atob(b64);
  var out = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++){ out[i] = bin.charCodeAt(i); }
  return out;
}

function decryptBundle(pin, bundle){
  var enc = new TextEncoder();
  return crypto.subtle
    .importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveKey"])
    .then(function(base){
      return crypto.subtle.deriveKey(
        {name:"PBKDF2", salt:b64ToBytes(bundle.salt),
         iterations:bundle.iterations, hash:"SHA-256"},
        base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    })
    .then(function(key){
      // A wrong PIN fails here: GCM checks its own tag, so there is nothing
      // to compare against and nothing to leak.
      return crypto.subtle.decrypt(
        {name:"AES-GCM", iv:b64ToBytes(bundle.iv)}, key, b64ToBytes(bundle.ct));
    })
    .then(function(plain){
      return JSON.parse(new TextDecoder().decode(plain));
    });
}

function startApp(){
  $("#gate").classList.add("hidden");
  $("#app").hidden = false;
  renderHome();
  show("home");
}

function showGate(bundle){
  var gate = $("#gate"), msg = $("#pinMsg"), input = $("#pinIn"), go = $("#pinGo");
  gate.classList.remove("hidden");
  input.focus();

  function attempt(pin, silent){
    if(!pin){ return; }
    msg.className = "gate-msg busy";
    msg.textContent = "Checking";
    go.disabled = true;
    decryptBundle(pin, bundle).then(function(people){
      ALL = people;
      try { localStorage.setItem(PIN_KEY, pin); } catch(e){}
      startApp();
    }).catch(function(){
      go.disabled = false;
      msg.className = "gate-msg";
      msg.textContent = silent ? "" : "Wrong PIN.";
      if(!silent){ input.value = ""; input.focus(); }
    });
  }

  go.addEventListener("click", function(){ attempt(input.value.trim(), false); });
  input.addEventListener("keydown", function(e){
    if(e.key === "Enter"){ attempt(input.value.trim(), false); }
  });

  // Remembered from last time on this device, so it asks once, not every visit.
  var saved = null;
  try { saved = localStorage.getItem(PIN_KEY); } catch(e){}
  if(saved){ attempt(saved, true); }
}

if(ALL.length){
  startApp();
} else {
  fetch("data.enc")
    .then(function(r){
      if(!r.ok){ throw new Error("no bundle"); }
      return r.json();
    })
    .then(showGate)
    .catch(function(){
      $("#app").hidden = false;
      $("#modeList").innerHTML =
        '<div class="empty">No data found. Put people.js next to this file.</div>';
      renderHome();
      show("home");
    });
}
</script>
